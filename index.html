          (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`,
          (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
        ];
        const proxyTimeoutsMs = [2200, 2500, 2800, 3000];

        const fetchViaProxies = async () => {
          let lastErr = '';
          for (let attempt = 0; attempt < 2; attempt++) {
            for (let i = 0; i < proxyBuilders.length; i++) {
              const proxyUrl = proxyBuilders[i](targetUrl);
              const timeoutMs = proxyTimeoutsMs[i] || 3000;
              try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), timeoutMs);
                log(`proxy#${i} attempt ${attempt + 1} (${timeoutMs}ms)…`);
                const pageRes = await fetch(proxyUrl, { signal: controller.signal });
                clearTimeout(timeout);
                if (!pageRes.ok) {
                  lastErr = `proxy#${i} HTTP ${pageRes.status}`;
                  log(lastErr);
                  continue;
                }
                let html = await pageRes.text();
                // allorigins /get returns JSON { contents }
                if (html.trim().startsWith('{') && html.includes('"contents"')) {
                  try {
                    const parsed = JSON.parse(html);
                    html = parsed.contents || '';
                  } catch (_) {}
                }
                if (html && html.length >= 40) {
                  log(`proxy#${i} OK len=${html.length}`);
                  return html;
                }
                lastErr = `proxy#${i} empty body`;
                log(lastErr);
              } catch (e) {
                lastErr = `proxy#${i} ${e.name || 'err'}: ${e.message || e}`;
                log(lastErr);
              }
            }
            if (attempt === 0) await new Promise(r => setTimeout(r, 250));
          }
          throw new Error(lastErr || 'All proxies failed');
        };

        const tokens = stripLegal(cleanComp).split(' ').map(t => t.replace(/[^a-z0-9]/g, '')).filter(t => t.length > 2);

        try {
          const html = await fetchViaProxies();
          const lower = html.toLowerCase();

          if (/\b404\b/.test(lower) && /not found|doesn't exist|does not exist|page not found/.test(lower) && html.length < 5000) {
            log('FAIL soft 404');
            return storeVerify({ ok: false, reason: 'Page looks like a 404' });
          }

          const title = (html.match(/<title[^>]*>([^<]*)<\/title>/i)?.[1] || '').toLowerCase();
          const metaDesc = (
            html.match(/<meta[^>]+name=["']description["'][^>]+content=["']([^"']+)["']/i)?.[1] ||
            html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+name=["']description["']/i)?.[1] ||
            html.match(/<meta[^>]+property=["']og:description["'][^>]+content=["']([^"']+)["']/i)?.[1] ||
            ''
          ).toLowerCase();
          const headers = [...html.matchAll(/<h[1-3][^>]*>([\s\S]*?)<\/h[1-3]>/gi)]
            .slice(0, 8)
            .map(m => m[1].replace(/<[^>]+>/g, ' ').toLowerCase())
            .join(' ');

          const focusCorpus = `${title} ${metaDesc} ${headers} ${domBase}`.slice(0, 6000);
          const fullNeedle = stripLegal(cleanComp);

          const fuzzyHit = (corpus, needle) => {
            if (!needle) return false;
            if (corpus.includes(needle)) return true;
            if (corpus.includes(needle.replace(/\s+/g, ''))) return true;
            return false;
          };

          if (fuzzyHit(focusCorpus, fullNeedle) || fuzzyHit(focusCorpus, nameKey)) {
            log('PASS content fuzzy match on title/meta/headers');
            return storeVerify({ ok: true, reason: 'Verified via DNS + page content match' });
          }

          if (tokens.length === 0) {
            const ok = focusCorpus.includes(nameKey);
            log(ok ? 'PASS' : 'FAIL', 'short-name content check');
            return storeVerify(ok
              ? { ok: true, reason: 'Verified via DNS + page content match' }
              : { ok: false, reason: 'Page content does not match company name' });
          }

          const hits = tokens.filter(t => focusCorpus.includes(t) || lower.slice(0, 12000).includes(t));
          const needed = Math.max(1, Math.ceil(tokens.length * 0.5));
          log('content token hits', hits.length, '/', tokens.length, 'needed', needed, hits);

          if (hits.length >= needed) {
            return storeVerify({ ok: true, reason: 'Verified via DNS + page content match' });
          }

          // Weak domain affinity + DNS already passed — accept rather than over-reject
          if (nameKey.length >= 4 && (domBase.includes(nameKey.slice(0, 4)) || nameKey.includes(domBase.slice(0, 4)))) {
            log('PASS weak domain affinity after partial content');
            return storeVerify({ ok: true, reason: 'Verified via DNS + partial domain/content signals' });
          }

          log('FAIL content mismatch');
          return storeVerify({
            ok: false,
            reason: `Page content does not match company name (matched ${hits.length}/${tokens.length} tokens)`
          });
        } catch (e) {
          log('proxy waterfall failed:', e.message || e);
          // Proxies are unreliable — if DNS resolved and there is any domain affinity, accept
          if (nameKey.length >= 3 && (domBase.includes(nameKey.slice(0, Math.min(4, nameKey.length))) || nameKey.includes(domBase.slice(0, Math.min(4, domBase.length))))) {
            log('PASS DNS + domain affinity after proxy failure');
            return storeVerify({ ok: true, reason: 'Verified via DNS (content proxy unavailable)' });
          }
          log('FAIL could not confirm without content or domain match');
          return storeVerify({ ok: false, reason: 'Could not fetch page to confirm company match' });
        }
      };

      useEffect(() => {
        if (editingCell && editInputRef.current) {
          editInputRef.current.focus();
          editInputRef.current.select();
        }
      }, [editingCell]);

      useEffect(() => {
        rowsRef.current = rows;
      }, [rows]);

      const getDelayFactor = () => {
        if (latencySpeed === 'calm') return 1.8;
        if (latencySpeed === 'fast') return 0.15;
        return 0.35; // default: keep a little pacing without multi-second padding
      };

      // Fill concurrent worker slots from the queue
      useEffect(() => {
        const free = ENRICH_CONCURRENCY - activeIds.length;
        if (free > 0 && queue.length > 0) {
          const take = queue.slice(0, free);
          if (!batchStartedAtRef.current) {
            batchStartedAtRef.current = performance.now();
            enrichmentValueRegistry.reset();
            enrichCache.clear();
            console.log(`[batch] starting with concurrency=${ENRICH_CONCURRENCY}; enrichment uniqueness registry cleared`);
          }
          setQueue(q => q.slice(take.length));
          setActiveIds(ids => [...ids, ...take]);
          setIsProcessingActive(true);
          return;
        }

        if (queue.length === 0 && activeIds.length === 0 && isProcessingActive) {
          const elapsed = batchStartedAtRef.current
            ? ((performance.now() - batchStartedAtRef.current) / 1000).toFixed(1)
            : '?';
          console.log(`[batch] complete in ${elapsed}s`);
          batchStartedAtRef.current = null;
          const successCount = rows.filter(r => r.status === 'found').length;
          if (successCount > 0) {
            window.confetti?.({
              particleCount: 80,
              spread: 60,
              origin: { y: 0.8 },
              colors: ['#5B7FA6', '#7DB89A', '#D8E2EC', '#A5C4D4']
            });
          }
          setIsProcessingActive(false);
        }
      }, [queue, activeIds, isProcessingActive, rows]);

      // Launch workers for newly active row IDs
      useEffect(() => {
        const release = (id) => {
          inFlightRef.current.delete(id);
          setActiveIds(ids => ids.filter(x => x !== id));
        };

        activeIds.forEach((rowId) => {
          if (inFlightRef.current.has(rowId)) return;
          inFlightRef.current.add(rowId);

          (async () => {
            const factor = getDelayFactor();
            const rowToProcess = rowsRef.current.find(r => r.id === rowId);
            if (!rowToProcess) {
              release(rowId);
              return;
            }

            const compKey = getCompanyColumnKey();
            const webKey = getWebsiteColumnKey();
            const indKey = getIndustryColumnKey();
            const hcKey = getHeadcountColumnKey();
            const locKey = getLocationColumnKey();
            const conKey = getContactsColumnKey();
            const genKey = getGenderColumnKey();
            const noteKey = getNotesColumnKey();

            const companyName = rowToProcess[compKey];
            const personContext = {
              personName: rowToProcess.personName || '',
              personTitle: rowToProcess.personTitle || ''
            };

            const finishUnverified = (fields) => {
              updateRow(rowId, { status: 'unverified', linkVerified: false, ...fields });
              release(rowId);
            };

            // Prefer Potential + picker over a dead-end Unverified whenever options exist
            const finishPotentialPicker = (fields) => {
              updateRow(rowId, {
                status: 'potential',
                linkVerified: false,
                selectionLocked: false,
                pickerOpen: true,
                candidatesUnconfirmed: true,
                userConfirmedDomain: false,
                ...fields
              });
              release(rowId);
            };

            try {
              if (!companyName || !companyName.trim() || companyName === '-') {
                finishUnverified({
                  [webKey]: '',
                  [indKey]: '-',
                  [hcKey]: '-',
                  [locKey]: '-',
                  [conKey]: '-',
                  [genKey]: '-',
                  [noteKey]: rowToProcess[noteKey] && rowToProcess[noteKey] !== 'Queueing...' && rowToProcess[noteKey] !== '-'
                    ? rowToProcess[noteKey]
                    : 'No company name provided',
                  resolveMethod: 'none'
                });
                return;
              }

              if (isNonEntityCompany(companyName)) {
                finishUnverified({
                  [webKey]: '',
                  [noteKey]: [rowToProcess[noteKey], 'Skipped: not a searchable company entity'].filter(n => n && n !== '-' && n !== 'Queueing...').join(' · '),
                  resolveMethod: 'skipped-non-entity'
                });
                return;
              }

              let domain = rowToProcess[webKey];
              let isDomainPrepopulated = !!domain && domain.includes('.') && domain !== '-';
              let isUnsure = false;
              let apiData = null;
              let industrySnippet = '';
              let alternatives = [];
              let candidates = rowToProcess.candidates || [];
              let resolveMethod = rowToProcess.resolveMethod || 'name-only';
              let fastPath = false;
              let autoSelectNote = '';
              const userConfirmed = !!rowToProcess.userConfirmedDomain;
              const skippedDomains = rowToProcess.skippedDomains || [];

              if (!isDomainPrepopulated) {
                updateRow(rowId, { status: 'searching' });
                const delayStart = Date.now();
                const usePerson = isAmbiguousCompanyName(companyName) && !isKnownUnambiguousCompany(companyName);
                const resolvedObj = await resolveDomain(
                  companyName,
                  financeFilterActive,
                  skippedDomains,
                  usePerson ? personContext : null
                );
                const elapsed = Date.now() - delayStart;
                // Tiny pacing only — never pad to 1s+ on fast path / cache hits
                if (!resolvedObj?.fastPath && !resolvedObj?.fromCache) {
                  const remainingDelay = (180 * factor) - elapsed;
                  if (remainingDelay > 0) await new Promise(r => setTimeout(r, remainingDelay));
                }

                if (resolvedObj && resolvedObj.domain) {
                  domain = resolvedObj.domain;
                  isUnsure = !!resolvedObj.isUnsure && !userConfirmed;
                  apiData = resolvedObj.apiData || null;
                  industrySnippet = resolvedObj.industrySnippet || resolvedObj.matchedName || '';
                  alternatives = resolvedObj.alternatives || [];
                  resolveMethod = resolvedObj.resolveMethod || 'name-only';
                  fastPath = !!resolvedObj.fastPath || isKnownUnambiguousCompany(companyName);
                  const confidenceScore = Number(resolvedObj.confidenceScore) || 0;
                  const confidenceSignals = resolvedObj.confidenceSignals || null;
                  // 70–79 → Potential picker; 80+ (with guards) / catalogue@90+ → auto-Found
                  const strongRecommend = !isUnsure && confidenceScore >= RESOLVE_CONFIDENCE_THRESHOLD;
                  const autoFound = shouldAutoFoundResolve({
                    ...resolvedObj,
                    domain,
                    isUnsure,
                    confidenceScore,
                    resolveMethod,
                    ambiguous: !!resolvedObj.ambiguous,
                    financeFilterActive,
                    soleFinanceMatch: !!resolvedObj.soleFinanceMatch,
                    exactName: !!resolvedObj.exactName,
                    confidenceSignals: confidenceSignals || resolvedObj.confidenceSignals
                  });
                  const trustedCatalogue = isTrustedCatalogueMethod(resolveMethod);
                  const decisive = resolvedObj.decisiveMatch || null;
                  // Only annotate when the pick came out of the Potential band via decisiveness
                  if (decisive && confidenceScore < RESOLVE_AUTO_FOUND_THRESHOLD) {
                    const label = decisive.rule === 'name-match'
                      ? 'clear name match'
                      : (decisive.rule === 'context-match' ? 'only industry-matching option' : 'only real company site');
                    autoSelectNote = `Auto-selected (${label})`;
                  }

                  // Skip expensive option-gathering on trusted auto-Found (was delaying Enriched for minutes)
                  const baseCandidates = normalizeCandidates(
                    resolvedObj.candidates,
                    resolvedObj.alternativeDomains,
                    alternatives,
                    [{ domain, name: resolvedObj.matchedName, snippet: industrySnippet }]
                  );
                  if (autoFound && (trustedCatalogue || fastPath)) {
                    candidates = baseCandidates.slice(0, 8);
                  } else {
                    candidates = await ensureWebsiteOptions(
                      companyName,
                      baseCandidates,
                      domain,
                      { name: resolvedObj.matchedName || companyName, snippet: industrySnippet }
                    );
                  }

                  updateRow(rowId, { status: 'verifying', [webKey]: domain, resolveMethod, candidates, confidenceScore, confidenceSignals });
                  const verification = await verifyDomainLive(domain, companyName, {
                    fastPath: fastPath && (strongRecommend || autoFound),
                    trustedCatalogue: trustedCatalogue && autoFound,
                    allowDnsFail: trustedCatalogue && autoFound
                  });
                  if (!verification.ok) {
                    const moreOpts = await ensureWebsiteOptions(companyName, candidates, '', {});
                    if (moreOpts.length) {
                      finishPotentialPicker({
                        [webKey]: '',
                        [indKey]: industrySnippet || '-',
                        [hcKey]: '-',
                        [locKey]: '-',
                        [conKey]: '-',
                        [genKey]: '-',
                        [noteKey]: [rowToProcess[noteKey] !== 'Queueing...' ? rowToProcess[noteKey] : '', verification.reason, 'Pick a website below'].filter(Boolean).join(' · '),
                        matchSnippet: industrySnippet,
                        candidates: moreOpts,
                        savedCandidates: moreOpts,
                        showManualDomain: false,
                        resolveMethod,
                        confidenceScore,
                        confidenceSignals
                      });
                    } else {
                      finishUnverified({
                        [webKey]: '',
                        [indKey]: industrySnippet || '-',
                        [hcKey]: '-',
                        [locKey]: '-',
                        [conKey]: '-',
                        [genKey]: '-',
                        [noteKey]: [rowToProcess[noteKey] !== 'Queueing...' ? rowToProcess[noteKey] : '', verification.reason, 'Enter a website manually'].filter(Boolean).join(' · '),
                        matchSnippet: industrySnippet,
                        candidates: [],
                        savedCandidates: [],
                        selectionLocked: false,
                        pickerOpen: true,
                        candidatesUnconfirmed: true,
                        showManualDomain: true,
                        resolveMethod
                      });
                    }
                    return;
                  }

                  // Auto-Found (≥90 or major-firm/dictionary/learned@100): skip picker, enrich now.
                  // Scores 70–89 stay Potential and require manual Confirm.
                  if (!userConfirmed && !autoFound) {
                    const midBand = confidenceScore >= RESOLVE_CONFIDENCE_THRESHOLD && confidenceScore < RESOLVE_AUTO_FOUND_THRESHOLD;
                    updateRow(rowId, {
                      status: 'potential',
                      [webKey]: strongRecommend || confidenceScore > 0 ? domain : (candidates[0]?.domain || domain || ''),
                      [indKey]: industrySnippet || '-',
                      [hcKey]: '-',
                      [locKey]: '-',
                      [conKey]: '-',
                      [genKey]: '-',
                      [noteKey]: [rowToProcess[noteKey] !== 'Queueing...' ? rowToProcess[noteKey] : '', candidates.length
                        ? (midBand
                          ? `Score ${confidenceScore} (confirm required under ${RESOLVE_AUTO_FOUND_THRESHOLD})`
                          : (strongRecommend ? 'Select the correct website below' : `Low confidence (score ${confidenceScore}) — confirm a website`))
                        : 'Enter the website manually'].filter(Boolean).join(' · '),
                      matchSnippet: industrySnippet,
                      linkVerified: false,
                      candidates,
                      savedCandidates: candidates,
                      selectionLocked: false,
                      pickerOpen: true,
                      candidatesUnconfirmed: isUnsure || !strongRecommend,
                      resolveMethod,
                      userConfirmedDomain: false,
                      showManualDomain: candidates.length === 0,
                      confidenceScore,
                      confidenceSignals
                    });
                    release(rowId);
                    return;
                  }

                  updateRow(rowId, {
                    [webKey]: domain,
                    status: 'enriching',
                    matchSnippet: industrySnippet,
                    linkVerified: true,
                    resolveMethod: autoFound && !userConfirmed ? (resolveMethod || 'auto-found') : resolveMethod,
                    userConfirmedDomain: false,
                    confidenceScore,
                    confidenceSignals,
                    pickerOpen: false,
                    selectionLocked: false,
                    candidatesUnconfirmed: false
                  });
                } else {
                  // No confident domain — still attach / fetch loose candidates for the picker
                  const looseCandidates = await ensureWebsiteOptions(
                    companyName,
                    normalizeCandidates(
                      resolvedObj?.candidates,
                      resolvedObj?.alternativeDomains,
                      alternatives,
                      candidates
                    ),
                    '',
                    {}
                  );
                  if (looseCandidates.length) {
                    finishPotentialPicker({
                      [webKey]: looseCandidates[0].domain || '',
                      [indKey]: '-',
                      [hcKey]: '-',
                      [locKey]: '-',
                      [conKey]: '-',
                      [genKey]: '-',
                      [noteKey]: [rowToProcess[noteKey] !== 'Queueing...' ? rowToProcess[noteKey] : '', 'No strong match — pick from options below'].filter(Boolean).join(' · '),
                      candidates: looseCandidates,
                      savedCandidates: looseCandidates,
                      showManualDomain: false,
                      resolveMethod: resolveMethod || 'multi-source'
                    });
                  } else {
                    finishUnverified({
                      [webKey]: '',
                      [indKey]: '-',
                      [hcKey]: '-',
                      [locKey]: '-',
                      [conKey]: '-',
                      [genKey]: '-',
                      [noteKey]: [rowToProcess[noteKey] !== 'Queueing...' ? rowToProcess[noteKey] : '', 'Could not find website candidates', 'Enter a website manually'].filter(Boolean).join(' · '),
                      candidates: [],
                      savedCandidates: [],
                      selectionLocked: false,
                      pickerOpen: true,
                      candidatesUnconfirmed: true,
                      showManualDomain: true,
                      resolveMethod: resolveMethod || 'none'
                    });
                  }
                  return;
                }
              } else {
                updateRow(rowId, { status: 'verifying' });
                // User-confirmed domains still go through real verification (no fastPath shortcut)
                const verification = await verifyDomainLive(domain, companyName, {
                  fastPath: isKnownUnambiguousCompany(companyName) && !userConfirmed
                });
                if (!verification.ok) {
                  const keepCandidates = normalizeCandidates(
                    rowToProcess.savedCandidates,
                    rowToProcess.candidates,
                    [{ domain, name: companyName, snippet: 'Previously selected — could not verify' }]
                  );
                  finishUnverified({
                    [webKey]: domain,
                    [noteKey]: verification.reason || 'Could not verify that domain — pick another or enter manually',
                    candidates: keepCandidates,
                    savedCandidates: keepCandidates,
                    selectionLocked: false,
                    pickerOpen: true,
                    candidatesUnconfirmed: true,
                    userConfirmedDomain: false,
                    resolveMethod: userConfirmed ? 'user-confirmed-failed' : 'manual'
                  });
                  return;
                }
                updateRow(rowId, { status: 'enriching', linkVerified: true, resolveMethod: userConfirmed ? 'user-confirmed' : 'manual' });
              }

              const details = await enrichCompanyDetails(domain, companyName, apiData);
              const priorNotes = rowToProcess[noteKey] && rowToProcess[noteKey] !== 'Queueing...' && rowToProcess[noteKey] !== '-'
                && !/Select the correct website|Pick a candidate|Select or enter a domain|Ambiguous matches|Candidates:|Possible matches|Enriching confirmed|Could not verify/i.test(rowToProcess[noteKey])
                ? rowToProcess[noteKey]
                : '';
              const noteWithSnippet = industrySnippet && details.notes && !details.notes.includes(industrySnippet)
                ? `${details.notes} [${industrySnippet}]`
                : details.notes;
              const mergedNotes = [priorNotes, noteWithSnippet, autoSelectNote].filter(Boolean).join(' · ');
              const keepForLater = normalizeCandidates(
                rowToProcess.savedCandidates,
                rowToProcess.candidates,
                candidates
              );

              updateRow(rowId, {
                [indKey]: details.industry,
                [hcKey]: details.headcount,
                [locKey]: details.location,
                [conKey]: details.contacts,
                [genKey]: details.gender,
                [noteKey]: mergedNotes || details.notes || '-',
                status: 'found',
                matchSnippet: industrySnippet,
                linkVerified: true,
                resolveMethod: userConfirmed ? 'user-confirmed' : resolveMethod,
                candidates: keepForLater,
                savedCandidates: keepForLater,
                selectionLocked: true,
                pickerOpen: false,
                candidatesUnconfirmed: false,
                userConfirmedDomain: false,
                showManualDomain: false,
                confidenceScore: rowToProcess.confidenceScore ?? null,
                accuracyFeedback: null
              });
              release(rowId);
            } catch (err) {
              console.error('[enrich] row failed', rowId, err);
              finishUnverified({
                [noteKey]: 'AI search error',
                resolveMethod: 'error'
              });
            }
          })();
        });
      }, [activeIds, financeFilterActive, latencySpeed]);

      const updateRow = (id, newFields) => {
        setRows(prev => prev.map(row => {
          if (row.id === id) {
            return { ...row, ...newFields };
          }
          return row;
        }));
      };

      const handleParsePreview = () => {
        if (!inputText.trim()) return;
        const lines = inputText.split('\n').filter(line => line.trim().length > 0);
        const preview = lines.map(line => {
          const parsed = parsePersonCompanyLine(line) || {
            raw: line,
            companyName: line.trim(),
            sourceContact: '',
            personName: '',
            personTitle: '',
            notes: ''
          };
          return {
            id: crypto.randomUUID(),
            raw: parsed.raw || line,
            companyName: parsed.companyName || '',
            sourceContact: parsed.sourceContact || '',
            personName: parsed.personName || '',
            personTitle: parsed.personTitle || '',
            notes: parsed.notes || '',
            alternates: parsed.alternates || []
          };
        });
        setParsePreview(preview);
      };

      const updatePreviewRow = (id, fields) => {
        setParsePreview(prev => prev.map(r => r.id === id ? { ...r, ...fields } : r));
      };

      const handleConfirmEnrichment = () => {
        if (!parsePreview || parsePreview.length === 0) return;

        const compKey = getCompanyColumnKey();
        const sourceKey = getSourceContactColumnKey();
        const noteKey = getNotesColumnKey();
        const webKey = getWebsiteColumnKey();

        const newRows = parsePreview.map(p => {
          const rowData = {
            id: crypto.randomUUID(),
            status: 'pending',
            personName: p.personName || '',
            personTitle: p.personTitle || '',
            resolveMethod: '',
            skippedDomains: []
          };
          headers.forEach(h => {
            rowData[h.key] = '-';
          });
          rowData[compKey] = p.companyName || '';
          rowData[sourceKey] = p.sourceContact || '';
          rowData[noteKey] = p.notes || 'Queueing...';
          rowData[webKey] = '';
          return rowData;
        });

        setRows(prev => [...prev, ...newRows]);
        setQueue(prev => [...prev, ...newRows.map(r => r.id)]);
        setParsePreview(null);
        setInputText('');
      };

      const handleRunEnrichment = () => {
        // Back-compat: Ctrl+Enter still works — show preview first
        handleParsePreview();
      };

      const handleAddBlankRow = () => {
        const newRow = {
          id: crypto.randomUUID(),
          status: 'pending'
        };
        headers.forEach(h => {
          newRow[h.key] = '';
        });
        setRows(prev => [...prev, newRow]);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const text = event.target?.result;
          if (typeof text !== 'string') return;

          let lines = [];
          if (file.name.endsWith('.csv')) {
            const rawLines = text.split(/\r?\n/);
            lines = rawLines.slice(1).filter(l => l.trim().length > 0);
          } else {
            lines = text.split(/\r?\n/).filter(line => line.trim().length > 0);
          }

          if (lines.length > 0) {
            setInputText(lines.join('\n'));
            // Defer preview so inputText state is set for display; parse lines directly
            const preview = lines.map(line => {
              const parsed = parsePersonCompanyLine(line) || {
                raw: line,
                companyName: line.trim(),
                sourceContact: '',
                personName: '',
                personTitle: '',
                notes: ''
              };
              return {
                id: crypto.randomUUID(),
                raw: parsed.raw || line,
                companyName: parsed.companyName || '',
                sourceContact: parsed.sourceContact || '',
                personName: parsed.personName || '',
                personTitle: parsed.personTitle || '',
                notes: parsed.notes || '',
                alternates: parsed.alternates || []
              };
            });
            setParsePreview(preview);
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const triggerRowReRun = (rowId) => {
        if (queue.includes(rowId) || activeIds.includes(rowId)) return;

        const noteKey = getNotesColumnKey();
        const webKey = getWebsiteColumnKey();
        
        setRows(prev => prev.map(row => {
          if (row.id === rowId) {
            const currentWebsite = row[webKey] ? row[webKey].trim().toLowerCase() : '';
            const prevSkipped = row.skippedDomains || [];
            const newSkipped = currentWebsite && !prevSkipped.includes(currentWebsite)
              ? [...prevSkipped, currentWebsite]
              : prevSkipped;

            return { 
              ...row, 
              status: 'pending',
              [webKey]: '', // Clear old website to trigger re-lookup
              [noteKey]: 'Re-running enrichment...',
              skippedDomains: newSkipped
            };
          }
          return row;
        }));
        setQueue(prev => [...prev, rowId]);
      };

      /**
       * Propose a domain for confirmation (does not verify yet).
       * @param {{ manual?: boolean }} opts — set manual when entered via "Enter manually"
       */
      const handleProposeCandidate = (rowId, rawDomain, opts = {}) => {
        if (!rawDomain || queue.includes(rowId) || activeIds.includes(rowId)) return;
        const clean = String(rawDomain)
          .trim()
          .toLowerCase()
          .replace(/^(https?:\/\/)?(www\.)?/, '')
          .split('/')[0]
          .replace(/[^a-z0-9.-]/g, '');
        if (!clean || !clean.includes('.')) return;
        updateRow(rowId, {
          pendingConfirmDomain: clean,
          pendingConfirmFromManual: !!opts.manual
        });
      };

      const handleCancelProposeCandidate = (rowId) => {
        updateRow(rowId, { pendingConfirmDomain: '', showManualDomain: false, pendingConfirmFromManual: false });
      };

      /**
       * After Confirm: verify+enrich that specific domain (does not force Found).
       * Also persists learned corrections for thumbs-down fixes and manual entries.
       */
      const handleConfirmCandidate = (rowId, rawDomain) => {
        if (!rawDomain || queue.includes(rowId) || activeIds.includes(rowId)) return;
        const clean = String(rawDomain)
          .trim()
          .toLowerCase()
          .replace(/^(https?:\/\/)?(www\.)?/, '')
          .split('/')[0]
          .replace(/[^a-z0-9.-]/g, '');
        if (!clean || !clean.includes('.')) return;

        const webKey = getWebsiteColumnKey();
        const noteKey = getNotesColumnKey();
        const indKey = getIndustryColumnKey();
        const hcKey = getHeadcountColumnKey();
        const locKey = getLocationColumnKey();
        const conKey = getContactsColumnKey();
        const genKey = getGenderColumnKey();
        const compKey = getCompanyColumnKey();
        const current = rowsRef.current.find(r => r.id === rowId) || rows.find(r => r.id === rowId);
        const companyName = current?.[compKey] || '';
        const shouldLearn = !!(current?.pendingLearnFromThumbsDown || current?.pendingConfirmFromManual);
        const learnSource = current?.pendingConfirmFromManual
          ? 'manual'
          : (current?.pendingLearnFromThumbsDown ? 'thumbs-down' : '');

        setRows(prev => prev.map(row => {
          if (row.id !== rowId) return row;
          const preserved = normalizeCandidates(row.savedCandidates, row.candidates);
          return {
            ...row,
            status: 'pending',
            [webKey]: clean,
            [indKey]: '-',
            [hcKey]: '-',
            [locKey]: '-',
            [conKey]: '-',
            [genKey]: '-',
            [noteKey]: 'Verifying selected domain...',
            linkVerified: undefined,
            userConfirmedDomain: true,
            selectionLocked: false,
            pickerOpen: false,
            showManualDomain: false,
            manualDomainDraft: '',
            pendingConfirmDomain: '',
            pendingConfirmFromManual: false,
            pendingLearnFromThumbsDown: false,
            resolveMethod: 'user-confirmed',
            candidates: preserved,
            savedCandidates: preserved,
            accuracyFeedback: null
          };
        }));
        // Drop stale enrich cache for this domain so dictionary founders re-apply on confirm
        try {
          const needle = String(clean).toLowerCase();
          for (const key of [...enrichCache.keys()]) {
            if (String(key).toLowerCase().includes(needle)) enrichCache.delete(key);
          }
        } catch (_) {}

        if (shouldLearn && companyName) {
          upsertLearnedCorrection({
            companyName,
            domain: clean,
            source: learnSource || 'manual'
          }).then(() => setLearnedTick(t => t + 1));
        }

        setQueue(prev => [...prev, rowId]);
      };

      const handleChangeSelection = (rowId) => {
        setRows(prev => prev.map(row => {
          if (row.id !== rowId) return row;
          const list = normalizeCandidates(row.savedCandidates, row.candidates);
          return {
            ...row,
            pickerOpen: true,
            selectionLocked: false,
            showManualDomain: false,
            pendingConfirmDomain: '',
            candidates: list,
            savedCandidates: list
          };
        }));
      };

      const handleAccuracyFeedback = (rowId, correct) => {
        const row = rowsRef.current.find(r => r.id === rowId) || rows.find(r => r.id === rowId);
        if (!row) return;
        const compKey = getCompanyColumnKey();
        const webKey = getWebsiteColumnKey();
        const stats = appendAccuracyFeedback({
          company: row[compKey] || '',
          domain: row[webKey] || '',
          correct: !!correct,
          resolveMethod: row.resolveMethod || '',
          confidenceScore: row.confidenceScore ?? null,
          sources: (row.candidates || []).find(c => c.domain === row[webKey])?.sources || []
        });
        setAccuracyStats(stats);
        if (correct) {
          updateRow(rowId, { accuracyFeedback: 'up', pendingLearnFromThumbsDown: false });
        } else {
          // Wrong website — reopen picker; next Confirm teaches a learned correction
          updateRow(rowId, { accuracyFeedback: 'down', pendingLearnFromThumbsDown: true });
          handleChangeSelection(rowId);
        }
      };

      const handleCellDoubleClick = (rowId, colName, currentValue) => {
        if (activeIds.includes(rowId)) return;
        setEditingCell({ id: rowId, column: colName });
        setEditingValue(currentValue || '');
      };

      const handleCellSave = () => {
        if (!editingCell) return;

        const { id, column } = editingCell;
        const currentRow = rows.find(r => r.id === id);
        if (!currentRow) return;

        const oldValue = currentRow[column];
        const newValue = editingValue.trim();

        setEditingCell(null);
        if (oldValue === newValue) return;

        updateRow(id, { [column]: newValue });

        // Auto trigger re-enrichment when core variables are corrected
        const compKey = getCompanyColumnKey();
        const webKey = getWebsiteColumnKey();
        if (column === compKey || column === webKey) {
          triggerRowReRun(id);
        }
      };

      const handleCellKeyDown = (e) => {
        if (e.key === 'Enter') {
          handleCellSave();
        } else if (e.key === 'Escape') {
          setEditingCell(null);
        }
      };

      const handleClearTable = () => {
        if (isDirty && !window.confirm('Clear the table? Unsaved changes will be lost.')) return;
        setRows([]);
        setQueue([]);
        setActiveIds([]);
        inFlightRef.current.clear();
        setIsProcessingActive(false);
        batchStartedAtRef.current = null;
      };

      const handleExportCSV = () => {
        if (rows.length === 0) return;

        const headerLabels = headers.map(h => h.label);
        const csvRows = [headerLabels.map(l => `"${l.replace(/"/g, '""')}"`).join(',')];

        rows.forEach(row => {
          const line = headers.map(h => {
            const val = row[h.key] || '';
            return `"${val.toString().replace(/"/g, '""')}"`;
          });
          csvRows.push(line.join(','));
        });

        const csvContent = csvRows.join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `company_enrichment_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const getExportMatrix = () => {
        const cols = [{ key: '_status', label: 'Status' }, ...headers];
        const aoa = [cols.map(c => c.label)];
        rows.forEach(row => {
          aoa.push(cols.map(c => {
            if (c.key === '_status') return row.status || '';
            return row[c.key] != null ? String(row[c.key]) : '';
          }));
        });
        return { cols, aoa };
      };

      const handleExportXLSX = () => {
        if (rows.length === 0) return;
        if (!window.XLSX) {
          alert('Excel export library failed to load. Please refresh and try again.');
          return;
        }
        const { aoa } = getExportMatrix();
        const ws = window.XLSX.utils.aoa_to_sheet(aoa);
        ws['!cols'] = aoa[0].map((_, i) => ({
          wch: Math.min(40, Math.max(10, ...aoa.map(r => String(r[i] || '').length)))
        }));
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, 'Enrichment');
        window.XLSX.writeFile(wb, `company_enrichment_${new Date().toISOString().slice(0,10)}.xlsx`);
      };

      const handleExportPDF = () => {
        if (rows.length === 0) return;
        const jspdfMod = window.jspdf;
        if (!jspdfMod || !jspdfMod.jsPDF) {
          alert('PDF export library failed to load. Please refresh and try again.');
          return;
        }
        const { jsPDF } = jspdfMod;
        const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
        const { cols, aoa } = getExportMatrix();
        doc.setFontSize(14);
        doc.text('Company Enrichment Export', 40, 36);
        doc.setFontSize(9);
        doc.setTextColor(100);
        doc.text(`Generated ${new Date().toLocaleString()} · ${rows.length} rows`, 40, 52);
        doc.setTextColor(0);

        if (typeof doc.autoTable !== 'function') {
          alert('PDF table plugin failed to load. Please refresh and try again.');
          return;
        }

        doc.autoTable({
          startY: 64,
          head: [aoa[0]],
          body: aoa.slice(1),
          styles: { fontSize: 7, cellPadding: 3, overflow: 'linebreak' },
          headStyles: { fillColor: [91, 127, 166], textColor: 255 },
          alternateRowStyles: { fillColor: [248, 250, 252] },
          margin: { left: 28, right: 28 }
        });
        doc.save(`company_enrichment_${new Date().toISOString().slice(0,10)}.pdf`);
      };

      const stats = {
        total: rows.length,
        pending: rows.filter(r => r.status === 'pending').length,
        searching: rows.filter(r => r.status === 'searching' || r.status === 'verifying' || r.status === 'enriching').length,
        found: rows.filter(r => r.status === 'found').length,
        potential: rows.filter(r => r.status === 'potential').length,
        unverified: rows.filter(r => r.status === 'unverified').length
      };

      const totalCompleted = stats.total - stats.pending - stats.searching;
      const progressPercent = stats.total > 0 ? Math.round((totalCompleted / stats.total) * 100) : 0;

      if (!unlocked) {
        return (
          <div className="app-container">
            <AccessGate onUnlock={() => setUnlocked(true)} />
          </div>
        );
      }

      return (
        <div className="app-container">
          {/* Header */}
          <header className="top-bar">
            <div className="brand-section">
              <h1 className="brand-title" style={{ display: 'flex', alignItems: 'center', letterSpacing: '0.75px', fontSize: '1.2rem', color: 'var(--text-primary)' }}>
                <span style={{ fontWeight: '800', marginRight: '0.15rem' }}>PLUM</span>
                <span style={{ fontWeight: '300' }}>ALLEY</span>
              </h1>
              <span className="brand-tagline">Paste company names. Get websites and data.</span>
            </div>
            <div className="actions-section" style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', flexWrap: 'wrap', justifyContent: 'flex-end' }}>
              <div className="user-chip" title="Site unlocked">
                <span>Unlocked</span>
                <button type="button" onClick={handleLogout}>Lock</button>
              </div>
              <span className={`save-status ${isDirty ? 'dirty' : ''}`}>
                {currentProjectName ? (
                  <>
                    {currentProjectName}
                    {isDirty ? ' · Unsaved changes' : (lastSavedAt ? ` · Saved ${formatSavedAt(lastSavedAt)}` : '')}
                  </>
                ) : (
                  isDirty ? 'Unsaved changes' : (projectMsg || 'No project loaded')
                )}
              </span>
              <div className="projects-wrap">
                <button
                  className="btn"
                  type="button"
                  onClick={() => { setProjectsOpen(o => !o); if (!projectsOpen) refreshProjects(); }}
                >
                  <span>Projects</span>
                </button>
                {projectsOpen && (
                  <div className="projects-menu">
                    <div className="projects-menu-header">
                      Saved on this browser {projectsBusy ? '· …' : ''}
                    </div>
                    <div className="projects-menu-actions">
                      <button type="button" disabled={projectsBusy || !hasContent} onClick={() => handleSaveProject({ saveAs: false })}>
                        Save
                      </button>
                      <button type="button" disabled={projectsBusy || !hasContent} onClick={() => handleSaveProject({ saveAs: true })}>
                        Save As
                      </button>
                      <button type="button" disabled={projectsBusy || !currentProjectId} onClick={handleRenameProject}>
                        Rename
                      </button>
                      <button type="button" disabled={projectsBusy || !currentProjectId} onClick={handleDeleteProject}>
                        Delete
                      </button>
                    </div>
                    <div className="projects-list">
                      {projects.length === 0 ? (
                        <div style={{ padding: '0.75rem', fontSize: '0.75rem', color: 'var(--text-secondary)' }}>
                          No saved projects yet.
                        </div>
                      ) : projects.map(p => (
                        <button
                          key={p.id}
                          type="button"
                          className={p.id === currentProjectId ? 'active' : ''}
                          onClick={() => handleLoadProject(p.id)}
                          title={p.name}
                        >
                          <span className="pname">{p.name}</span>
                          <span className="pmeta">
                            {formatSavedAt(p.updated_at)}
                          </span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </div>
              <label style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', fontSize: '0.78rem', color: 'var(--text-secondary)', cursor: 'pointer', border: '1px dashed var(--border-color)', padding: '0.4rem 0.6rem', borderRadius: '6px', backgroundColor: financeFilterActive ? '#EFF6FF' : 'transparent', borderColor: financeFilterActive ? '#93C5FD' : 'var(--border-color)', userSelect: 'none' }} title="Prioritize finance/fintech/VC matches and deprioritize unrelated industries (publishing, media, education, etc.). Shows industry snippets when names collide.">
                <input 
                  type="checkbox" 
                  checked={financeFilterActive}
                  onChange={(e) => setFinanceFilterActive(e.target.checked)}
                  style={{ cursor: 'pointer', margin: 0 }}
                />
                <span style={{ fontWeight: financeFilterActive ? '600' : '400', color: financeFilterActive ? '#1E40AF' : 'inherit' }}>
                  💼 Finance Search Filter
                </span>
              </label>
              <button className="btn" title="Configure simulation parameters" onClick={() => setShowSettings(true)}>
                <SlidersIcon size={15} />
                <span>Settings</span>
              </button>
              <button
                className="btn"
                title="View and edit domains taught via thumbs-down or manual entry"
                onClick={() => { setLearnedNotice(''); setShowLearned(true); setLearnedTick(t => t + 1); }}
              >
                <span>Learned ({getLearnedCorrectionsSnapshot().corrections.length})</span>
              </button>
              <div
                className="accuracy-chip"
                title="Running website-resolution accuracy from thumbs up/down on Found rows (stored in this browser)"
              >
                <span>Accuracy</span>
                <strong>
                  {accuracyStats.total
                    ? `${accuracyStats.rate}% (${accuracyStats.correct}/${accuracyStats.total})`
                    : '—'}
                </strong>
              </div>
              <button className="btn btn-danger" disabled={rows.length === 0} onClick={handleClearTable}>
                <TrashIcon size={15} />
                <span>Clear Table</span>
              </button>
              <div className="export-group">
                <button className="btn btn-primary" disabled={rows.length === 0} onClick={handleExportCSV} title="Export as CSV">
                  <DownloadIcon size={15} />
                  <span>CSV</span>
                </button>
                <button className="btn btn-primary" disabled={rows.length === 0} onClick={handleExportXLSX} title="Export as Excel (.xlsx)">
                  <DownloadIcon size={15} />
                  <span>XLSX</span>
                </button>
                <button className="btn btn-primary" disabled={rows.length === 0} onClick={handleExportPDF} title="Export as PDF table">
                  <DownloadIcon size={15} />
                  <span>PDF</span>
                </button>
              </div>
              <button className="btn" disabled={rows.length === 0} onClick={resetColumns} title="Reset column widths to defaults">
                <span style={{ fontSize: '0.75rem' }}>Reset Cols</span>
              </button>
            </div>
          </header>

          {/* Paste & Input Area */}
          <section className="input-section">
            <div className="input-header">
              <div>
                <h2 className="input-title">Batch Company List</h2>
                <span className="input-subtitle">Paste lists or load CSV sheets to begin domain resolution.</span>
              </div>
              <label className="file-upload-label">
                <UploadIcon size={14} />
                <span>Import TXT / CSV</span>
                <input 
                  type="file" 
                  ref={fileInputRef}
                  accept=".csv,.txt" 
                  className="file-upload-input" 
                  onChange={handleFileUpload} 
                />
              </label>
            </div>

            <div className="textarea-container">
              <textarea
                className="company-textarea"
                placeholder={"Paste person + company lines (tab-separated), e.g.\nLibby Cantrill – Managing Director\tPIMCO\nTom Cheesman – Partner\tStable"}
                value={inputText}
                onChange={(e) => setInputText(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter' && e.ctrlKey) {
                    handleParsePreview();
                  }
                }}
              />
            </div>

            <div className="input-controls">
              <span className="input-subtitle" style={{ fontStyle: 'italic' }}>
                Tip: Ctrl + Enter parses a preview first — correct companies, then confirm enrichment
              </span>
              <button className="btn btn-primary" onClick={handleParsePreview} disabled={!inputText.trim()}>
                <SearchIcon size={14} />
                <span>Parse & Preview</span>
              </button>
            </div>

            {parsePreview && (
              <div className="parse-preview">
                <div className="parse-preview-header">
                  <div>
                    <strong style={{ fontSize: '0.9rem' }}>Parse preview</strong>
                    <div className="input-subtitle">Edit Company if needed, then confirm to enrich. Contact/Source and Notes are kept.</div>
                  </div>
                  <div style={{ display: 'flex', gap: '0.4rem' }}>
                    <button className="btn" onClick={() => setParsePreview(null)}>Cancel</button>
                    <button className="btn btn-primary" onClick={handleConfirmEnrichment}>
                      <CheckIcon size={14} />
                      <span>Confirm & Enrich ({parsePreview.length})</span>
                    </button>
                  </div>
                </div>
                <div style={{ overflowX: 'auto', maxHeight: '280px' }}>
                  <table className="parse-preview-table">
                    <thead>
                      <tr>
                        <th style={{ width: '28%' }}>Company (editable)</th>
                        <th style={{ width: '28%' }}>Contact / Source</th>
                        <th style={{ width: '20%' }}>Notes</th>
                        <th>Original line</th>
                      </tr>
                    </thead>
                    <tbody>
                      {parsePreview.map(row => (
                        <tr key={row.id}>
                          <td>
                            <input
                              value={row.companyName}
                              onChange={(e) => updatePreviewRow(row.id, { companyName: e.target.value })}
                              placeholder="Company name"
                            />
                          </td>
                          <td>{row.sourceContact || '—'}</td>
                          <td>
                            <input
                              value={row.notes}
                              onChange={(e) => updatePreviewRow(row.id, { notes: e.target.value })}
                              placeholder="Notes"
                            />
                          </td>
                          <td><div className="parse-preview-raw" title={row.raw}>{row.raw}</div></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </section>

          {/* Stats Bar */}
          {rows.length > 0 && (
            <section className="stats-panel">
              <div className="stat-item">
                <span className="stat-label">Total Rows:</span>
                <span className="stat-value">{stats.total}</span>
              </div>
              <div className="stat-item">
                <span className="stat-label">Enriched:</span>
                <span className="stat-value" style={{ color: 'var(--success-text)' }}>{stats.found}</span>
              </div>
              <div className="stat-item">
                <span className="stat-label">Potential:</span>
                <span className="stat-value" style={{ color: '#D97706' }}>{stats.potential}</span>
              </div>
              <div className="stat-item">
                <span className="stat-label">Unverified:</span>
                <span className="stat-value" style={{ color: 'var(--error-text)' }}>{stats.unverified}</span>
              </div>
              <div className="stat-item">
                <span className="stat-label">Queue:</span>
                <span className="stat-value">{stats.pending + stats.searching}</span>
              </div>

              {(stats.pending > 0 || stats.searching > 0) && (
                <div className="stat-progress-bar-container">
                  <div className="stat-progress-track">
                    <div className="stat-progress-bar" style={{ width: `${progressPercent}%` }} />
                  </div>
                  <span className="stat-subtitle" style={{ minWidth: '30px' }}>{progressPercent}%</span>
                </div>
              )}
            </section>
          )}

          {/* Spreadsheet Table Grid */}
          <section className="table-workspace">
            {rows.length === 0 ? (
              <div className="empty-state">
                <div className="empty-state-icon">
                  <SearchIcon size={40} />
                </div>
                <h3 className="empty-state-title">Quiet Productivity Dashboard</h3>
                <p className="empty-state-subtitle">
                  Paste a list of company names (optionally split by dashes, bars, tabs, or spaces) to begin. Double-click headers to rename.
                </p>
              </div>
            ) : (
              <div className="table-wrapper">
                <div className="table-scroll-container">
                  <table className="spreadsheet-table">
                    <thead>
                      <tr>
                        <th className="col-status" style={{ width: colWidths['status'] || 118, minWidth: 100 }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <span>Status</span>
                            <div className="col-resizer" onMouseDown={(e) => startResize(e, 'status')} />
                          </div>
                        </th>
                        {headers.map(col => (
                          <th key={col.key} className={`col-${col.key}`} style={{ width: colWidths[col.key] || undefined, minWidth: 60 }}>
                            {editingHeader === col.key ? (
                              <input
                                ref={headerEditRef}
                                className="header-editor"
                                value={editingHeaderValue}
                                onChange={(e) => setEditingHeaderValue(e.target.value)}
                                onBlur={handleHeaderSave}
                                onKeyDown={handleHeaderKeyDown}
                              />
                            ) : (
                              <div
                                onDoubleClick={() => handleHeaderDoubleClick(col.key, col.label)}
                                title="Double-click header to rename · drag edge to resize"
                                style={{ cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}
                              >
                                <span>{col.label}</span>
                                <div className="col-resizer" onMouseDown={(e) => startResize(e, col.key)} />
                              </div>
                            )}
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {rows.map((row) => {
                        const isRowProcessing = activeIds.includes(row.id);
                        
                        // Resolve dynamic headers
                        const compKey = getCompanyColumnKey();
                        const webKey = getWebsiteColumnKey();
                        const indKey = getIndustryColumnKey();
                        const hcKey = getHeadcountColumnKey();
                        const locKey = getLocationColumnKey();
                        const conKey = getContactsColumnKey();
                        const noteKey = getNotesColumnKey();

                        return (
                          <tr key={row.id} className="table-row">
                            {/* Status Badge */}
                            <td>
                              <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem' }}>
                                {row.status === 'pending' && (
                                  <span className="status-badge pending">
                                    <ClockIcon size={12} />
                                    <span>Pending</span>
                                  </span>
                                )}
                                {row.status === 'searching' && (
                                  <span className="status-badge searching">
                                    <LoaderIcon size={12} className="spinner" />
                                    <span>Searching...</span>
                                  </span>
                                )}
                                {row.status === 'verifying' && (
                                  <span className="status-badge pending" style={{ backgroundColor: '#FEF3C7', color: '#92400E', borderColor: '#FDE68A' }}>
                                    <LoaderIcon size={12} className="spinner" />
                                    <span>Verifying link...</span>
                                  </span>
                                )}
                                {row.status === 'enriching' && (
                                  <span className="status-badge searching">
                                    <LoaderIcon size={12} className="spinner" />
                                    <span>Enriching...</span>
                                  </span>
                                )}
                                {row.status === 'found' && (
                                  <span className="status-badge found">
                                    <CheckIcon size={12} />
                                    <span>Found</span>
                                  </span>
                                )}
                                {row.status === 'found' && (
                                  <span className="accuracy-feedback" onClick={(e) => e.stopPropagation()}>
                                    <button
                                      type="button"
                                      className={row.accuracyFeedback === 'up' ? 'active-up' : ''}
                                      title="Mark website as correct"
                                      onClick={() => handleAccuracyFeedback(row.id, true)}
                                    >
                                      <ThumbsUpIcon size={12} />
                                    </button>
                                    <button
                                      type="button"
                                      className={row.accuracyFeedback === 'down' ? 'active-down' : ''}
                                      title="Mark website as incorrect"
                                      onClick={() => handleAccuracyFeedback(row.id, false)}
                                    >
                                      <ThumbsDownIcon size={12} />
                                    </button>
                                  </span>
                                )}
                                {row.status === 'potential' && (
                                  <span className="status-badge pending" style={{ backgroundColor: '#FEF3C7', color: '#D97706', borderColor: '#FDE68A' }}>
                                    <AlertCircleIcon size={12} style={{ color: '#D97706' }} />
                                    <span>Potential Link</span>
                                  </span>
                                )}
                                {row.status === 'unverified' && (
                                  <span className="status-badge unverified" title={row[noteKey]}>
                                    <AlertCircleIcon size={12} />
                                    <span style={{ whiteSpace: 'normal', display: 'block', wordBreak: 'break-all' }}>Unverified</span>
                                  </span>
                                )}
                                
                                {!isRowProcessing && row.status !== 'pending' && (
                                  <button 
                                    className="btn" 
                                    style={{ padding: '0.15rem 0.3rem', fontSize: '0.7rem', borderRadius: '4px', height: 'auto', border: 'none', background: 'transparent' }}
                                    title="Re-run enrichment"
                                    onClick={() => triggerRowReRun(row.id)}
                                  >
                                    <RefreshIcon size={11} style={{ color: 'var(--text-secondary)' }} />
                                  </button>
                                )}
                              </div>
                            </td>

                            {/* Dynamic Columns mapping */}
                            {headers.map(col => {
                              const isCellEditing = editingCell?.id === row.id && editingCell?.column === col.key;
                              
                              return (
                                <td 
                                  key={col.key}
                                  className={`editable-cell ${col.key === webKey ? 'url-cell' : ''} ${col.key === noteKey ? 'notes-cell' : ''}`}
                                  onDoubleClick={() => handleCellDoubleClick(row.id, col.key, row[col.key])}
                                  title="Double-click to edit cell"
                                >
                                  {isCellEditing ? (
                                    <input
                                      ref={editInputRef}
                                      className={`cell-editor ${col.key === webKey ? 'mono' : ''}`}
                                      value={editingValue}
                                      onChange={(e) => setEditingValue(e.target.value)}
                                      onBlur={handleCellSave}
                                      onKeyDown={handleCellKeyDown}
                                    />
                                  ) : (
                                    // Custom renders depending on header mappings
                                    col.key === compKey ? (
                                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', width: '100%' }}>
                                        <span style={{ overflow: 'hidden', textOverflow: 'ellipsis' }}>
                                          {row[col.key] || <span style={{ color: 'var(--text-secondary)', fontStyle: 'italic' }}>[Empty]</span>}
                                        </span>
                                        {row[col.key] && row[col.key] !== '-' && (
                                          <a 
                                            href={`https://www.google.com/search?q=${encodeURIComponent(row[col.key])}`}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            title="Search Google"
                                            style={{ color: 'var(--text-secondary)', opacity: 0.6, display: 'inline-flex', alignSelf: 'center', marginLeft: '4px' }}
                                            onClick={(e) => e.stopPropagation()}
                                          >
                                            <SearchIcon size={11} />
                                          </a>
                                        )}
                                      </div>
                                    ) : col.key === webKey ? (
                                      (() => {
                                        const list = normalizeCandidates(row.candidates, row.savedCandidates);
                                        const showPicker = (row.status === 'potential' || row.status === 'unverified' || row.pickerOpen) && !row.selectionLocked;
                                        const isFoundLocked = row.status === 'found' && row.linkVerified !== false && row.selectionLocked && !row.pickerOpen;
                                        const isFoundLink = row.status === 'found' && row.linkVerified !== false && row[col.key] && row[col.key] !== '-';

                                        if (showPicker) {
                                          const companyLabel = row[compKey] || 'this company';
                                          const pendingDomain = row.pendingConfirmDomain || '';
                                          return (
                                            <div className="candidate-picker" onClick={(e) => e.stopPropagation()} onDoubleClick={(e) => e.stopPropagation()}>
                                              {row[col.key] && row[col.key] !== '-' && !pendingDomain && (
                                                <span className="url-plain" title="Current selection / best guess">
                                                  {row[col.key]}
                                                </span>
                                              )}
                                              {pendingDomain ? (
                                                <div className="candidate-confirm-box">
                                                  <div className="candidate-confirm-text">
                                                    Confirm <strong>{pendingDomain}</strong> as the website for {companyLabel}?
                                                  </div>
                                                  <div className="candidate-confirm-actions">
                                                    <button
                                                      type="button"
                                                      className="candidate-confirm-yes"
                                                      onClick={() => handleConfirmCandidate(row.id, pendingDomain)}
                                                    >
                                                      Confirm
                                                    </button>
                                                    <button
                                                      type="button"
                                                      className="candidate-confirm-no"
                                                      onClick={() => handleCancelProposeCandidate(row.id)}
                                                    >
                                                      Cancel
                                                    </button>
                                                  </div>
                                                </div>
                                              ) : (
                                                <>
                                                  <span className="candidate-picker-label">
                                                    {list.length
                                                      ? (row.candidatesUnconfirmed || row.status === 'unverified'
                                                        ? 'Possible matches (unconfirmed)'
                                                        : 'Select correct website')
                                                      : 'Enter website'}
                                                  </span>
                                                  {list.slice(0, 8).map((c) => (
                                                    <div key={c.domain} className="candidate-option">
                                                      <span className="candidate-option-name">{c.name || c.domain}</span>
                                                      <a
                                                        className="candidate-option-domain"
                                                        href={`https://${c.domain}`}
                                                        target="_blank"
                                                        rel="noopener noreferrer"
                                                        title={`Open ${c.domain} in a new tab (preview only)`}
                                                        onClick={(e) => e.stopPropagation()}
                                                      >
                                                        <span>{c.domain}</span>
                                                        <ExternalLinkIcon size={9} />
                                                      </a>
                                                      {c.snippet ? (
                                                        <span className="candidate-option-snippet">{c.snippet}</span>
                                                      ) : null}
                                                      <button
                                                        type="button"
                                                        className="candidate-select-btn"
                                                        onClick={() => handleProposeCandidate(row.id, c.domain)}
                                                      >
                                                        Select this one
                                                      </button>
                                                    </div>
                                                  ))}
                                                  {row.showManualDomain ? (
                                                    <div className="candidate-manual-row">
                                                      <input
                                                        type="text"
                                                        placeholder="example.com"
                                                        value={row.manualDomainDraft || ''}
                                                        onChange={(e) => updateRow(row.id, { manualDomainDraft: e.target.value })}
                                                        onKeyDown={(e) => {
                                                          if (e.key === 'Enter') handleProposeCandidate(row.id, row.manualDomainDraft, { manual: true });
                                                        }}
                                                      />
                                                      <button
                                                        type="button"
                                                        onClick={() => handleProposeCandidate(row.id, row.manualDomainDraft, { manual: true })}
                                                      >
                                                        Use
                                                      </button>
                                                    </div>
                                                  ) : (
                                                    <button
                                                      type="button"
                                                      className="candidate-manual-btn"
                                                      onClick={() => updateRow(row.id, { showManualDomain: true })}
                                                    >
                                                      None of these / Enter manually
                                                    </button>
                                                  )}
                                                  {row.status === 'found' && (
                                                    <button
                                                      type="button"
                                                      className="candidate-change-btn"
                                                      onClick={() => updateRow(row.id, { pickerOpen: false, selectionLocked: true, showManualDomain: false, pendingConfirmDomain: '' })}
                                                    >
                                                      Cancel
                                                    </button>
                                                  )}
                                                </>
                                              )}
                                            </div>
                                          );
                                        }

                                        if (isFoundLink) {
                                          return (
                                            <div className="candidate-locked-domain" onClick={(e) => e.stopPropagation()} onDoubleClick={(e) => e.stopPropagation()}>
                                              <a
                                                href={row[col.key].startsWith('http') ? row[col.key] : `https://${row[col.key]}`}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="url-link"
                                                title="Verified website"
                                              >
                                                <span>{row[col.key]}</span>
                                                <ExternalLinkIcon size={10} />
                                              </a>
                                              <button
                                                  type="button"
                                                  className="candidate-change-btn"
                                                  title="Change selection"
                                                  onClick={() => handleChangeSelection(row.id)}
                                                >
                                                  <RefreshIcon size={10} />
                                                  <span>Change selection</span>
                                                </button>
                                            </div>
                                          );
                                        }

                                        if (row[col.key] && row[col.key] !== '-') {
                                          return (
                                            <span className="url-plain" title="Not verified">
                                              {row[col.key]}
                                            </span>
                                          );
                                        }
                                        return <span style={{ color: 'var(--text-secondary)' }}>-</span>;
                                      })()
                                    ) : col.key === indKey ? (
                                      <div style={{ display: 'flex', flexDirection: 'column', maxWidth: '100%' }}>
                                        <span style={{ overflow: 'hidden', textOverflow: 'ellipsis' }}>{row[col.key] || '-'}</span>
                                      </div>
                                    ) : col.key === locKey ? (
                                      row[col.key] && row[col.key] !== '-' ? (
                                        <a 
                                          href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(row[col.key])}`} 
                                          target="_blank" 
                                          rel="noopener noreferrer"
                                          className="url-link"
                                          style={{ color: 'inherit' }}
                                          onClick={(e) => e.stopPropagation()}
                                        >
