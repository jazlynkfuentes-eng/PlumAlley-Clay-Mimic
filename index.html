                                          <span>{row[col.key]}</span>
                                          <ExternalLinkIcon size={8} style={{ opacity: 0.5, marginLeft: '3px' }} />
                                        </a>
                                      ) : (
                                        '-'
                                      )
                                    ) : col.key === conKey ? (
                                      (() => {
                                        const founderVal = row[col.key] || '';
                                        const isUnknown = !founderVal || founderVal === '-' || /^unknown$/i.test(founderVal) || /^needs manual/i.test(founderVal) || /^needs verification/i.test(founderVal);
                                        const hasFounder = !isUnknown;
                                        const searchQuery = hasFounder 
                                          ? `${row[compKey] || ''} ${founderVal}`
                                          : `${row[compKey] || ''} founder`;
                                        const displayVal = hasFounder ? founderVal : 'Unknown';
                                        return (
                                          <a 
                                            href={`https://www.google.com/search?q=${encodeURIComponent(searchQuery)}`} 
                                            target="_blank" 
                                            rel="noopener noreferrer"
                                            className="url-link"
                                            onClick={(e) => e.stopPropagation()}
                                            title={`Search Google for: "${searchQuery}"`}
                                          >
                                            <span>{displayVal}</span>
                                            <ExternalLinkIcon size={10} />
                                          </a>
                                        );
                                      })()
                                    ) : (
                                      (() => {
                                        const val = row[col.key];
                                        const isEnrichField = col.key === indKey || col.key === hcKey || col.key === locKey;
                                        if (val && val !== '-') return val;
                                        return isEnrichField ? 'Unknown' : '-';
                                      })()
                                    )
                                  )}
                                </td>
                              );
                            })}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {rows.length > 0 && (
              <div className="table-bottom-actions">
                <button className="btn-add-row" onClick={handleAddBlankRow}>
                  <PlusIcon size={12} />
                  <span>Add Empty Row</span>
                </button>
                <span style={{ fontSize: '0.75rem', color: 'var(--text-secondary)' }}>
                  Double-click cells or headers to edit. Renaming header keys (e.g. to "Company") will auto-remap AI search keys dynamically.
                </span>
              </div>
            )}
          </section>

          {/* Preferences Settings Modal */}
          {showSettings && (
            <div className="settings-modal-overlay">
              <div className="settings-modal">
                <div className="settings-header">
                  <h3 className="settings-title">Processing Preferences</h3>
                  <button className="settings-close" onClick={() => setShowSettings(false)}>
                    <XIcon size={18} />
                  </button>
                </div>
                
                <div className="form-group">
                  <label className="form-label">Simulation Processing Speed</label>
                  <select 
                    className="form-input" 
                    value={latencySpeed}
                    onChange={(e) => setLatencySpeed(e.target.value)}
                  >
                    <option value="calm">Calm & Restful (Slow latency)</option>
                    <option value="normal">Standard (Default network speed)</option>
                    <option value="fast">Speed Demon (Immediate replies)</option>
                  </select>
                  <p style={{ fontSize: '0.75rem', color: 'var(--text-secondary)', marginTop: '0.2rem' }}>
                    Adjusts the artificial lag of the Base44 simulation calls to let you inspect cell transitions.
                  </p>
                </div>

                <div className="form-group" style={{ borderTop: '1px solid var(--border-color)', paddingTop: '0.75rem' }}>
                  <label className="form-label">Simulated AI Model Prompt</label>
                  <textarea 
                    className="form-input" 
                    style={{ fontSize: '0.8rem', resize: 'none', height: '60px', fontFamily: 'var(--font-mono)' }} 
                    readOnly
                    value='Find the official website domain for the company named [X]. Return only the domain.'
                  />
                </div>

                <button 
                  className="btn btn-primary" 
                  style={{ alignSelf: 'flex-end', marginTop: '0.5rem' }}
                  onClick={() => setShowSettings(false)}
                >
                  Save & Close
                </button>
              </div>
            </div>
          )}

          {/* Learned Corrections modal */}
          {showLearned && (
            <div className="settings-modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) setShowLearned(false); }}>
              <div className="settings-modal" style={{ width: 'min(640px, 94vw)', maxHeight: '90vh', overflow: 'auto' }}>
                <div className="settings-header">
                  <h3 className="settings-title">Learned Corrections</h3>
                  <button className="settings-close" onClick={() => setShowLearned(false)}>
                    <XIcon size={18} />
                  </button>
                </div>
                <p style={{ fontSize: '0.8rem', color: 'var(--text-secondary)', marginBottom: '0.75rem' }}>
                  Domains taught via thumbs-down + confirm, or manual entry. Checked before search on future runs.
                  Saved to this browser and to <code>data/learned-corrections.json</code> when using <code>npm run dev:local</code>.
                </p>
                <div className="learned-toolbar">
                  <input
                    type="search"
                    placeholder="Search company or domain…"
                    value={learnedSearch}
                    onChange={(e) => setLearnedSearch(e.target.value)}
                  />
                  <button
                    type="button"
                    className="btn"
                    onClick={() => {
                      downloadLearnedCorrectionsJson();
                      setLearnedNotice('Downloaded learned-corrections.json — replace data/learned-corrections.json and commit to share.');
                    }}
                  >
                    Download JSON
                  </button>
                  <button
                    type="button"
                    className="btn"
                    onClick={async () => {
                      const remote = await persistLearnedCorrectionsToServer(getLearnedCorrectionsSnapshot());
                      setLearnedNotice(remote.ok
                        ? `Synced to data/learned-corrections.json (${remote.count} entries).`
                        : `Could not write file (${remote.reason || 'no local API'}). Use Download JSON + commit, or run npm run dev:local.`);
                      setLearnedTick(t => t + 1);
                    }}
                  >
                    Sync to repo file
                  </button>
                </div>
                {learnedNotice ? (
                  <div style={{ fontSize: '0.75rem', color: 'var(--accent-color)', marginBottom: '0.6rem' }}>{learnedNotice}</div>
                ) : null}
                <div className="learned-list">
                  {learnedList.length === 0 ? (
                    <div style={{ padding: '1rem', fontSize: '0.8rem', color: 'var(--text-secondary)' }}>
                      No learned corrections yet. Thumbs-down a Found row and confirm the right domain, or enter a domain manually.
                    </div>
                  ) : learnedList.map((c) => {
                    const draft = learnedDrafts[c.companyKey] || {
                      companyName: c.companyName,
                      domain: c.domain
                    };
                    return (
                      <div key={c.companyKey} className="learned-row">
                        <input
                          value={draft.companyName}
                          onChange={(e) => setLearnedDrafts(prev => ({
                            ...prev,
                            [c.companyKey]: { ...draft, companyName: e.target.value }
                          }))}
                          title="Company name"
                        />
                        <input
                          value={draft.domain}
                          onChange={(e) => setLearnedDrafts(prev => ({
                            ...prev,
                            [c.companyKey]: { ...draft, domain: e.target.value }
                          }))}
                          title="Domain"
                          style={{ fontFamily: 'var(--font-mono)' }}
                        />
                        <div style={{ display: 'flex', gap: '0.25rem' }}>
                          <button
                            type="button"
                            className="btn"
                            style={{ padding: '0.25rem 0.45rem', fontSize: '0.72rem' }}
                            onClick={async () => {
                              const res = await updateLearnedCorrection(c.companyKey, {
                                companyName: draft.companyName,
                                domain: draft.domain,
                                source: 'edit'
                              });
                              if (res.ok === false && res.reason) {
                                setLearnedNotice(`Could not save: ${res.reason}`);
                              } else {
                                setLearnedDrafts(prev => {
                                  const next = { ...prev };
                                  delete next[c.companyKey];
                                  return next;
                                });
                                setLearnedTick(t => t + 1);
                                setLearnedNotice('Updated.');
                              }
                            }}
                          >
                            Save
                          </button>
                          <button
                            type="button"
                            className="btn btn-danger"
                            style={{ padding: '0.25rem 0.45rem', fontSize: '0.72rem' }}
                            onClick={async () => {
                              await removeLearnedCorrection(c.companyKey);
                              setLearnedDrafts(prev => {
                                const next = { ...prev };
                                delete next[c.companyKey];
                                return next;
                              });
                              setLearnedTick(t => t + 1);
                              setLearnedNotice('Removed.');
                            }}
                          >
                            Remove
                          </button>
                        </div>
                        <div className="learned-meta">
                          source={c.source || '—'} · updated {c.updatedAt ? formatSavedAt(c.updatedAt) : '—'}
                        </div>
                      </div>
                    );
                  })}
                </div>
                <button
                  className="btn btn-primary"
                  style={{ alignSelf: 'flex-end', marginTop: '0.75rem' }}
                  onClick={() => setShowLearned(false)}
                >
                  Close
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
