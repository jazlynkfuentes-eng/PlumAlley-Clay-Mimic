        const m = String(t).match(/(-?\d{1,4})/);
        return m ? parseInt(m[1], 10) : null;
      } catch (_) { return null; }
    }

    function claimInstanceIds(entity) {
      const claims = entity?.claims?.P31 || [];
      return claims.map(c => c?.mainsnak?.datavalue?.value?.id).filter(Boolean);
    }

    function claimOfficialDomain(entity) {
      const claim = entity?.claims?.P856?.[0]?.mainsnak?.datavalue?.value;
      return claim ? extractUrlDomain(claim) : '';
    }

    function scoreWikidataProminence(entity, title, description) {
      let score = 0;
      const reasons = [];
      const employees = claimAmount(entity, 'P1128');
      if (employees != null && !Number.isNaN(employees)) {
        if (employees >= 10000) { score += 80; reasons.push(`${employees}+ employees`); }
        else if (employees >= 1000) { score += 55; reasons.push(`${employees} employees`); }
        else if (employees >= 200) { score += 30; reasons.push(`${employees} employees`); }
        else if (employees >= 50) { score += 10; reasons.push(`${employees} employees`); }
      }
      const founded = claimYear(entity, 'P571');
      if (founded != null) {
        if (founded <= 1950) { score += 35; reasons.push(`founded ${founded}`); }
        else if (founded <= 1985) { score += 25; reasons.push(`founded ${founded}`); }
        else if (founded <= 2005) { score += 12; reasons.push(`founded ${founded}`); }
      }
      const desc = String(description || entity?.descriptions?.en?.value || '').toLowerCase();
      if (/\b(largest|global|fortune|multinational|ivy league|flagship)\b/.test(desc)) {
        score += 25;
        reasons.push('notable description');
      }
      if (title && /\b(group|inc\.?|corporation|university|college|foundation)\b/i.test(title)) {
        score += 8;
      }
      // Having an official website claim is a weak notability signal
      if (claimOfficialDomain(entity)) score += 5;
      return { score, employees, founded, reasons, description: desc };
    }

    async function fetchWikidataEntitiesForName(companyName, cleanedName) {
      const queries = [companyName, cleanedName, `${companyName} company`, `${companyName} (company)`]
        .map(q => String(q || '').trim())
        .filter((q, i, arr) => q && q.length >= 2 && arr.indexOf(q) === i);

      const results = [];
      for (const wq of queries.slice(0, 3)) {
        try {
          const openJson = await fetchWikiApiJson(
            `https://en.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(wq)}&limit=6&namespace=0&format=json&origin=*`,
            { label: `prominence-opensearch:${wq}` }
          );
          if (!openJson) {
            await new Promise(r => setTimeout(r, 200));
            continue;
          }
          const titles = openJson[1] || [];
          if (!titles.length) continue;

          const qTokens = wq.toLowerCase().split(/\s+/).filter(t => t.length > 2);
          const ranked = titles.map((t) => {
            const tl = t.toLowerCase();
            let s = qTokens.filter(tok => tl.includes(tok)).length * 12;
            if (tl === wq.toLowerCase()) s += 50;
            if (/\b(company|group|inc|corporation|university|college|foundation|partners|capital)\b/i.test(t)) s += 10;
            // Deprioritize disambiguation / film / music noise
            if (/\(disambiguation\)|\balbum\b|\bfilm\b|\bsong\b/i.test(t)) s -= 40;
            return { title: t, titleScore: s };
          }).filter(x => x.titleScore >= 8).sort((a, b) => b.titleScore - a.titleScore);

          for (const { title, titleScore } of ranked.slice(0, 3)) {
            const wd = await fetchWikiApiJson(
              `https://www.wikidata.org/w/api.php?action=wbgetentities&sites=enwiki&titles=${encodeURIComponent(title)}&props=claims|descriptions|labels&languages=en&format=json&origin=*`,
              { label: `prominence-wb:${title}` }
            );
            await new Promise(r => setTimeout(r, 120));
            if (!wd) continue;
            const entity = Object.values(wd.entities || {}).find(e => e && e.claims && !e.missing);
            if (!entity) continue;
            const description = entity?.descriptions?.en?.value || '';
            const domain = claimOfficialDomain(entity);
            const prominence = scoreWikidataProminence(entity, title, description);
            const instanceIds = claimInstanceIds(entity);
            results.push({
              title,
              titleScore,
              domain,
              description,
              entity,
              instanceIds,
              prominenceScore: prominence.score,
              prominenceReasons: prominence.reasons,
              employees: prominence.employees,
              founded: prominence.founded
            });
          }
          if (results.length) break;
        } catch (e) {
          console.warn('[wikidata] lookup failed', wq, e);
        }
      }
      // Dedupe by domain/title
      const seen = new Set();
      return results.filter(r => {
        const k = `${r.domain}|${r.title}`;
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
      });
    }

    /**
     * Prominence disambiguation for ANY company name with multiple plausible domains.
     * Prefer a clearly larger/more notable Wikidata entity's official site; if two are
     * similarly prominent, mark ambiguous (Potential) instead of guessing.
     */
    async function crossCheckProminentDomain(companyName, candidateDomain, cleanedName, clearbitAlternatives = []) {
      const major = lookupMajorKnownFirm(companyName);
      const cand = String(candidateDomain || '').toLowerCase().replace(/^(https?:\/\/)?(www\.)?/, '').split('/')[0];
      if (major) {
        if (cand === major.domain) return null;
        return {
          action: 'override',
          domain: major.domain,
          label: major.label,
          snippet: `${major.label} · ${major.industry} (canonical)`,
          alternatives: [cand, major.domain].filter(Boolean)
        };
      }

      const key = companyKeyNorm(companyName);
      if (!key || key.length < 2) return null;

      const wikiHits = await fetchWikidataEntitiesForName(companyName, cleanedName);
      const withDomain = wikiHits.filter(h => h.domain && h.domain.includes('.') && !h.domain.includes('wikipedia.org'));
      const prominent = withDomain
        .filter(h => h.prominenceScore >= 25 || h.employees >= 200 || (h.founded && h.founded <= 1995))
        .sort((a, b) => b.prominenceScore - a.prominenceScore);

      const candBase = cand.split('.')[0].replace(/[^a-z0-9]/g, '');
      const bestWiki = prominent[0] || withDomain.sort((a, b) => b.prominenceScore - a.prominenceScore)[0];

      if (bestWiki) {
        const wikiBase = bestWiki.domain.split('.')[0].replace(/[^a-z0-9]/g, '');
        const wikiIsProminent = bestWiki.prominenceScore >= 25 || (bestWiki.employees != null && bestWiki.employees >= 200);

        // Candidate is a longer compound of the brand (blackstonecap) while wiki has exact apex
        if (
          wikiIsProminent &&
          bestWiki.domain !== cand &&
          wikiBase === key &&
          candBase !== key &&
          candBase.includes(key)
        ) {
          console.log('[resolve] prominence override (compound→canonical)', companyName, cand, '->', bestWiki.domain, bestWiki.prominenceReasons);
          return {
            action: 'override',
            domain: bestWiki.domain,
            label: bestWiki.title,
            snippet: `${bestWiki.title} · ${bestWiki.description || 'Wikipedia'} (${bestWiki.prominenceReasons.join(', ') || 'notable'})`,
            alternatives: [cand, bestWiki.domain]
          };
        }

        // Wiki official site differs and is clearly more prominent than a weak Clearbit pick
        if (wikiIsProminent && bestWiki.domain !== cand && (wikiBase === key || bestWiki.prominenceScore >= 40)) {
          // If Clearbit also suggested the wiki domain, strongly prefer it
          const altDomains = (clearbitAlternatives || []).map(a => String(a).toLowerCase());
          const clearbitHadWiki = altDomains.some(d => d === bestWiki.domain || d.startsWith(wikiBase + '.'));
          if (clearbitHadWiki || wikiBase === key || bestWiki.prominenceScore >= 50) {
            console.log('[resolve] prominence override', companyName, cand, '->', bestWiki.domain);
            return {
              action: 'override',
              domain: bestWiki.domain,
              label: bestWiki.title,
              snippet: `${bestWiki.title} · Wikidata prominence`,
              alternatives: [cand, bestWiki.domain, ...altDomains].filter(Boolean).slice(0, 4)
            };
          }
        }

        // Two wiki hits similarly prominent with different domains → ambiguous
        if (prominent.length >= 2 && prominent[0].domain !== prominent[1].domain) {
          const gap = prominent[0].prominenceScore - prominent[1].prominenceScore;
          if (gap < 20) {
            return {
              action: 'ambiguous',
              domain: prominent[0].domain,
              label: prominent[0].title,
              alternatives: prominent.slice(0, 3).map(p => p.domain)
            };
          }
        }
      }

      // Clearbit-only ambiguity: multiple distinct domains returned for same name
      const uniqAlts = [...new Set((clearbitAlternatives || []).map(d => String(d || '').toLowerCase()).filter(Boolean))];
      if (uniqAlts.length >= 2) {
        const apexMatches = uniqAlts.filter(d => d.split('.')[0].replace(/[^a-z0-9]/g, '') === key);
        const compounds = uniqAlts.filter(d => {
          const b = d.split('.')[0].replace(/[^a-z0-9]/g, '');
          return b !== key && b.includes(key);
        });
        if (apexMatches.length === 1 && compounds.length >= 1) {
          if (cand !== apexMatches[0]) {
            return {
              action: 'override',
              domain: apexMatches[0],
              label: companyName,
              snippet: `${companyName} · preferred exact domain over lookalikes`,
              alternatives: uniqAlts.slice(0, 4)
            };
          }
        }
        // No exact apex among Clearbit hits (common for short/acronym names) → Potential, don't guess
        if (apexMatches.length === 0) {
          return {
            action: 'ambiguous',
            domain: cand,
            label: companyName,
            alternatives: uniqAlts.slice(0, 4)
          };
        }
      }

      return null;
    }

    /**
     * Sector from entity type — wins over free-text keyword scraping.
     * Sync signals: TLD + name patterns. Async Wikidata fills gaps.
     */
    function inferEntityTypeIndustry(companyName, domain) {
      const host = String(domain || '').toLowerCase().replace(/^(https?:\/\/)?(www\.)?/, '').split('/')[0];
      const name = String(companyName || '').trim();
      const blob = `${name} ${host}`.toLowerCase();

      // Foundations / nonprofits first — "West Virginia University Foundation" is a foundation, not a university
      if (/\b(foundation|non-?profit|nonprofit|charity|ngo|church|temple|mosque|synagogue|parish|congregation)\b/i.test(blob)) {
        return 'Nonprofit / Foundation';
      }
      if (/\.edu$/i.test(host) || /\b(university|college|polytechnic|school|academy|institute of technology)\b/i.test(name)) {
        return 'Education';
      }
      if (/\.gov$/i.test(host) || /\b(department of|ministry of|city of|county of|state of|government|municipal|agency|authority|commission|office of the|comptroller)\b/i.test(name)) {
        return 'Government';
      }
      return null;
    }

    function industryFromWikidataInstances(instanceIds, companyName, domain) {
      if (!instanceIds || !instanceIds.length) return null;
      if (instanceIds.some(id => WD_EDUCATION.has(id))) return 'Education';
      if (instanceIds.some(id => WD_GOVERNMENT.has(id))) return 'Government';
      if (instanceIds.some(id => WD_NONPROFIT_STRONG.has(id))) return 'Nonprofit / Foundation';
      // Weak org type + name/domain hints
      if (instanceIds.some(id => WD_NONPROFIT.has(id)) && inferEntityTypeIndustry(companyName, domain)) {
        return inferEntityTypeIndustry(companyName, domain);
      }
      return null;
    }

    async function lookupWikidataEntityType(companyName, domain) {
      const sync = inferEntityTypeIndustry(companyName, domain);
      if (sync) return { industry: sync, source: 'name-or-tld' };

      try {
        const hits = await fetchWikidataEntitiesForName(companyName, companyName);
        const host = String(domain || '').toLowerCase().replace(/^(https?:\/\/)?(www\.)?/, '').split('/')[0];
        // Prefer the hit whose official domain matches what we resolved
        const ordered = [...hits].sort((a, b) => {
          const aMatch = a.domain && host && a.domain === host ? 1 : 0;
          const bMatch = b.domain && host && b.domain === host ? 1 : 0;
          return bMatch - aMatch || b.prominenceScore - a.prominenceScore;
        });
        for (const hit of ordered) {
          const fromP31 = industryFromWikidataInstances(hit.instanceIds, companyName, domain);
          if (fromP31) return { industry: fromP31, source: 'wikidata', title: hit.title };
          const desc = String(hit.description || '').toLowerCase();
          if (/\buniversity\b|\bcollege\b|\beducational institution\b/.test(desc)) {
            return { industry: 'Education', source: 'wikidata-desc', title: hit.title };
          }
          if (/\bgovernment\b|\bpublic agency\b|\bmunicipal\b/.test(desc)) {
            return { industry: 'Government', source: 'wikidata-desc', title: hit.title };
          }
          if (/\bnon-?profit\b|\bfoundation\b|\bcharity\b|\bphilanthrop/.test(desc)) {
            return { industry: 'Nonprofit / Foundation', source: 'wikidata-desc', title: hit.title };
          }
        }
      } catch (e) {
        console.warn('[enrich] wikidata entity type failed', e);
      }
      return null;
    }

    async function resolveDomain(companyName, financeFilterActive = false, skippedDomains = [], personContext = null) {
      // Fast path / unambiguous companies: never spend person-context search budget
      const skipPerson = isKnownUnambiguousCompany(companyName) || !isAmbiguousCompanyName(companyName);
      const effectivePerson = skipPerson ? null : personContext;

      const cacheKey = makeResolveCacheKey(companyName, financeFilterActive, skippedDomains, effectivePerson);
      if (resolveCache.has(cacheKey)) {
        const cached = resolveCache.get(cacheKey);
        console.log('[resolve] CACHE HIT', companyName, '->', cached?.domain || null);
        return cached ? { ...cached, fromCache: true } : null;
      }

      // Accumulates every Clearbit/search suggestion so the picker can show them
      // even when no single candidate passes strict verification.
      let gatheredCandidates = [];

      const store = (result) => {
        if (!result) {
          if (gatheredCandidates.length > 0) {
            result = {
              domain: gatheredCandidates[0].domain,
              isUnsure: true,
              matchedName: gatheredCandidates[0].name,
              industrySnippet: gatheredCandidates[0].snippet || 'Possible match (unconfirmed)',
              candidates: gatheredCandidates,
              alternativeDomains: gatheredCandidates.map(c => c.domain),
              alternatives: gatheredCandidates.map(c => c.snippet || c.name || c.domain),
              resolveMethod: 'name-only'
            };
            console.log('[resolve] no confident hit — returning', gatheredCandidates.length, 'picker candidates for', companyName);
          }
        } else {
          const merged = normalizeCandidates(
            result.candidates,
            gatheredCandidates,
            result.alternativeDomains,
            result.domain
              ? [{ domain: result.domain, name: result.matchedName || result.name || result.domain, snippet: result.industrySnippet || result.snippet || '' }]
              : []
          );
          if (merged.length) {
            result = {
              ...result,
              candidates: merged,
              alternativeDomains: merged.map(c => c.domain)
            };
          }
        }
        resolveCache.set(cacheKey, result);
        return result;
      };

      // No artificial latency on the hot path — real network time is enough
      if (!companyName || companyName.trim().length < 2) {
        return store(null);
      }

      // Internal labels / non-entity rows — skip search entirely
      if (isNonEntityCompany(companyName) || /\(\s*moderator\s*\)/i.test(companyName)) {
        console.log('[resolve] skipping non-entity label:', companyName);
        return store(null);
      }

      // Learned corrections (thumbs-down / manual teach) — highest priority, skip search
      const learnedHit = lookupLearnedCorrection(companyName);
      if (learnedHit && learnedHit.domain && !skippedDomains.includes(String(learnedHit.domain).toLowerCase())) {
        console.log('[resolve] LEARNED correction', companyName, '->', learnedHit.domain);
        gatheredCandidates = normalizeCandidates(
          [{
            domain: learnedHit.domain,
            name: learnedHit.companyName || companyName,
            snippet: `Learned correction · ${learnedHit.source || 'user'}`,
            sources: ['learned']
          }],
          gatheredCandidates
        );
        return store({
          domain: learnedHit.domain,
          isUnsure: false,
          confidenceScore: 100,
          matchedName: learnedHit.companyName || companyName,
          industrySnippet: `Learned correction (${learnedHit.source || 'user'})`,
          candidates: gatheredCandidates,
          alternativeDomains: gatheredCandidates.map(c => c.domain),
          alternatives: gatheredCandidates.map(c => c.snippet || c.name || c.domain),
          resolveMethod: 'learned',
          fastPath: true
        });
      }

      // Globally recognized firms: prefer the canonical domain immediately.
      // Do NOT await Clearbit/DDG/Wiki here — that delayed Enriched by tens of seconds per row.
      const majorFirm = lookupMajorKnownFirm(companyName);
      if (majorFirm && !skippedDomains.includes(majorFirm.domain.toLowerCase())) {
        console.log('[resolve] MAJOR FIRM canonical', companyName, '->', majorFirm.domain);
        gatheredCandidates = normalizeCandidates(
          [{
            domain: majorFirm.domain.toLowerCase(),
            name: majorFirm.label,
            snippet: `${majorFirm.label} · ${majorFirm.industry}`,
            sources: ['major-firm']
          }],
          gatheredCandidates
        );
        return store({
          domain: majorFirm.domain.toLowerCase(),
          isUnsure: false,
          confidenceScore: 100,
          matchedName: majorFirm.label,
          industrySnippet: `${majorFirm.label} · ${majorFirm.industry}`,
          alternatives: gatheredCandidates.map(c => c.snippet || c.name || c.domain),
          alternativeDomains: gatheredCandidates.map(c => c.domain),
          candidates: gatheredCandidates,
          resolveMethod: 'major-firm',
          fastPath: true
        });
      }

      // Check if we are running from a local server to execute real-time backend scrapers
      const isLocalServer = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.port === '8081';
      if (isLocalServer) {
        try {
          const skipParam = (skippedDomains || []).join(',');
          const response = await fetch(`/api/enrich?name=${encodeURIComponent(companyName)}&skip=${encodeURIComponent(skipParam)}`);
          const ct = response.headers.get('content-type') || '';
          if (response.ok && ct.includes('application/json')) {
            const data = await response.json();
            if (data && !data.error && data.domain) {
              return store({
                domain: data.domain,
                isUnsure: !!data.isUnsure,
                apiData: data,
                matchedName: data.name || companyName,
                industrySnippet: data.industry || data.notes || '',
                candidates: normalizeCandidates(data.candidates, [{ domain: data.domain, name: data.name, snippet: data.industry }]),
                resolveMethod: 'name-only'
              });
            }
          }
        } catch (e) {
          console.error("Local enrichment API failed, falling back to local waterfall...", e);
        }
      }

      // Advanced query cleaning helper
      const getCleanedQuery = (name) => {
        return name
          .trim()
          .toLowerCase()
          .replace(/[,.]?\s*\b(inc|llc|co|corp|corporation|ltd|limited|gmbh|sa|as|ab|oy|bv|nv|pvt|plc|holdings|group|associates|global|international|advisors|management|consulting|services|solutions|systems|technologies|networks|labs|digital|media|design|creative|agency|studio|studios|collective|cooperative|coop|ventures|ventures\s+capital|capital|partners)\b/gi, "")
          .replace(/^the\s+/i, "")
          .replace(/\bcompany\b$/i, "")
          .replace(/\s+/g, " ")
          .trim();
      };

      let cleaned = getCleanedQuery(companyName);
      const baseCleaned = cleaned; // preserve pre-finance-augmented name for scoring

      // Waterfall Tier 0: Direct Catalogue Lookup (Ensures offline dictionary items resolve instantly)
      const localClean = cleaned.replace(/[^a-z0-9]/g, '');
      const rawKey = companyName.trim().toLowerCase();
      if (companyDictionary[rawKey]) {
        const d = companyDictionary[rawKey].domain.toLowerCase();
        if (!skippedDomains.includes(d)) {
          console.log('[resolve] FAST PATH dictionary', companyName, '->', d);
          return store({
            domain: d,
            isUnsure: false,
            confidenceScore: 100,
            industrySnippet: companyDictionary[rawKey].industry,
            candidates: [{ domain: d, name: companyName, snippet: companyDictionary[rawKey].industry, sources: ['dictionary'] }],
            resolveMethod: 'dictionary',
            fastPath: true
          });
        }
      }
      if (companyDictionary[localClean]) {
        const d = companyDictionary[localClean].domain.toLowerCase();
        if (!skippedDomains.includes(d)) {
          console.log('[resolve] FAST PATH dictionary', companyName, '->', d);
          return store({
            domain: d,
            isUnsure: false,
            confidenceScore: 100,
            industrySnippet: companyDictionary[localClean].industry,
            candidates: [{ domain: d, name: companyName, snippet: companyDictionary[localClean].industry, sources: ['dictionary'] }],
            resolveMethod: 'dictionary',
            fastPath: true
          });
        }
      }
      for (const key in companyDictionary) {
        const d = companyDictionary[key].domain.toLowerCase();
        const keyNorm = key.replace(/[^a-z0-9]/g, '');
        if ((localClean === keyNorm || rawKey === key || localClean.includes(keyNorm) || keyNorm.includes(localClean)) && !skippedDomains.includes(d)) {
          // Avoid ultra-short accidental partials
          if (Math.min(localClean.length, keyNorm.length) < 4 && localClean !== keyNorm) continue;
          console.log('[resolve] FAST PATH dictionary fuzzy', companyName, '->', d);
          return store({
            domain: d,
            isUnsure: false,
            confidenceScore: 90,
            industrySnippet: companyDictionary[key].industry,
            candidates: [{ domain: d, name: companyName, snippet: companyDictionary[key].industry, sources: ['dictionary'] }],
            resolveMethod: 'dictionary',
            fastPath: true
          });
        }
      }

      // Multi-source parallel gather (Clearbit + DuckDuckGo + Wikipedia/Wikidata)
      // → shared candidate pool → multi-signal confidence scoring.
      const STOP_TOKENS = new Set(['office', 'west', 'new', 'the', 'city', 'of', 'and', 'for', 'group', 'fund', 'private', 'public', 'global', 'international', 'united', 'american', 'national']);
      const firstToken = String(baseCleaned || companyName).trim().split(/\s+/)[0];
      const strippedLegal = String(companyName)
        .replace(/\b(llc|inc|ltd|limited|corp|corporation|co)\b/gi, '')
        .replace(/&/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      const strippedOrgSuffix = String(companyName)
        .replace(/\b(foundation|endowment|trust)\b/gi, '')
        .replace(/^office of\s+/i, '')
        .replace(/&/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      let searchQuery = cleaned;
      if (financeFilterActive) {
        const financeTerms = ['capital', 'partners', 'ventures', 'investment', 'holdings', 'wealth', 'finance', 'fund', 'equity', 'management', 'pe', 'vc', 'advisory', 'advisors', 'associates', 'group', 'fintech', 'bank'];
        const hasFinanceTerm = financeTerms.some(term => cleaned.toLowerCase().includes(term));
        if (!hasFinanceTerm) searchQuery = `${cleaned} capital`;
      }

      // Dictionary soft-seed queries: short ambiguous names (e.g. Stable) often miss the
      // canonical domain on Clearbit ("Stable" → usestable.com) unless we query the slug.
      const dictSeed = companyDictionary[rawKey] || companyDictionary[localClean] || null;
      const dictDomainSlug = dictSeed?.domain ? String(dictSeed.domain).split('.')[0] : null;
      const dictIndustryHint = dictSeed?.industry || '';

      // Aggressive shortening for Clearbit coverage gaps (long legal names)
      const brandShort = String(baseCleaned || companyName)
        .replace(/\b(the|and|of|for)\b/gi, ' ')
        .replace(/\b(investment|management|wealth|markets|solutions|advisors?|advisory|partners|group|foundation|system|university|retirement|board|office|growth|hedge|fund|capital|introductions|marketplace|global|limited|llc|llp)\b/gi, ' ')
        .replace(/[–—-]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      const brandTokens = brandShort.split(/\s+/).filter(Boolean);
      const brandCore = brandTokens.slice(0, 2).join(' ');
      const usableShort = brandShort && companyKeyNormLite(brandShort).length >= 5 ? brandShort : null;
      const usableCore = brandCore && companyKeyNormLite(brandCore).length >= 5 ? brandCore : null;
      const usableFirst = brandTokens[0] && brandTokens[0].length >= 5 ? brandTokens[0] : null;

      const nameOnlyQueries = [
        strippedLegal,
        strippedOrgSuffix,
        baseCleaned || companyName,
        companyName.replace(/&/g, ' ').replace(/\s+/g, ' ').trim(),
        companyName,
        searchQuery,
        usableShort,
        usableCore,
        usableFirst,
        dictDomainSlug || null,
        dictSeed ? `${companyName} ${dictIndustryHint}`.trim() : null,
        dictSeed && /investment|asset|capital|venture|equity|advisory|finance/i.test(dictIndustryHint)
          ? `${companyName} asset management`
          : null,
        (firstToken && firstToken.length >= 4 && !STOP_TOKENS.has(firstToken.toLowerCase())) ? firstToken : null,
        buildNameAcronym(companyName) || null,
        /comptroller/i.test(companyName) && /new york|nyc/i.test(companyName) ? 'New York City Comptroller' : null,
        /securities and exchange/i.test(companyName) ? 'U.S. Securities and Exchange Commission' : null,
        /fifth third/i.test(companyName) ? 'Fifth Third Bancorp' : null,
        /international business machines/i.test(companyName) ? 'IBM' : null
      ].filter((q, i, arr) => q && String(q).trim().length >= 2 && arr.indexOf(q) === i);

      console.log('[resolve] multi-source gather for', companyName);

      const govSeeds = seedGovernmentCandidates(companyName);
      const catalogueSeeds = [];
      if (dictSeed?.domain && !skippedDomains.includes(String(dictSeed.domain).toLowerCase())) {
        catalogueSeeds.push({
          domain: String(dictSeed.domain).toLowerCase(),
          name: companyName,
          snippet: dictIndustryHint || 'Catalogue',
          sources: ['dictionary', 'dict-seed']
        });
      }

      const [cbPool, ddgPool, wikiPool] = await Promise.all([
        gatherClearbitCandidates(nameOnlyQueries),
        gatherDuckDuckGoCandidates(companyName, baseCleaned),
        gatherWikipediaWikidataCandidates(companyName, baseCleaned)
      ]);

      gatheredCandidates = normalizeCandidates(gatheredCandidates, catalogueSeeds, govSeeds, cbPool, ddgPool, wikiPool);

      // Coverage gap: when every primary source is empty, try "[name] official website" web fallback
      // for picker candidates (not a scoring change — just something to show / verify).
      if (!gatheredCandidates.length) {
        console.log('[resolve] empty pool — official-website web fallback for', companyName);
        const fallback = await gatherOfficialWebsiteFallback(companyName);
        gatheredCandidates = normalizeCandidates(gatheredCandidates, fallback);
      }

      // Optional person-context Clearbit pass for ambiguous names
      const usePerson = effectivePerson && (effectivePerson.personName || effectivePerson.personTitle)
        && isAmbiguousCompanyName(companyName);
      if (usePerson) {
        const pName = effectivePerson.personName || '';
        const pTitle = effectivePerson.personTitle || '';
        const personQueries = [
          `${companyName} ${pName}`.trim(),
          `${pName} ${pTitle} ${companyName}`.trim(),
          `${pName} ${companyName} capital`.trim(),
          `${companyName} ${pTitle}`.trim()
        ].filter((q, i, arr) => q && arr.indexOf(q) === i);
        const personCb = await gatherClearbitCandidates(personQueries);
        gatheredCandidates = normalizeCandidates(gatheredCandidates, personCb.map(c => ({
          ...c,
          sources: [...new Set([...(c.sources || []), 'clearbit-person'])],
          snippet: c.snippet || (pName ? `via ${pName}` : '')
        })));
      }

      // Finance filter: annotate finance-typed snippets for the picker
      if (financeFilterActive) {
        gatheredCandidates = gatheredCandidates.map(c => {
          if (isFinanceTypedCandidate(c, companyName)) {
            return { ...c, snippet: c.snippet || `${c.name || c.domain} · finance` };
          }
          return c;
        });
      }

      if (!gatheredCandidates.length) {
        console.log('[resolve] no candidates from any source for', companyName);
        return store(null);
      }

      const ranked = await rankCandidatesWithSignals(companyName, gatheredCandidates, {
        skippedDomains,
        financeFilterActive,
        checkContent: true
      });

      gatheredCandidates = normalizeCandidates(ranked.candidates, gatheredCandidates);

      if (!ranked.best || !ranked.best.domain) {
        return store(null);
      }

      const score = ranked.best.totalScore || 0;
      const sourcesArr = ranked.best.sources || [];
      // Avoid confident picks that are Clearbit-only junk with weak name overlap
      const nameSim = ranked.best.signals?.nameSimilarity || 0;
      const credible =
        ranked.best.exactName ||
        nameSim >= 28 ||
        sourcesArr.length >= 2 ||
        sourcesArr.includes('wikidata') ||
        sourcesArr.includes('wikipedia') ||
        sourcesArr.includes('duckduckgo') ||
        sourcesArr.includes('dictionary');
      // A decisive candidate is a confident recommendation even when the raw score
      // lands in the Potential band (e.g. willkie.com at 67).
      const decisiveMatch = ranked.decisive && ranked.decisive.domain === ranked.best.domain
        ? ranked.decisive
        : null;
      const clearsThreshold = (score >= RESOLVE_CONFIDENCE_THRESHOLD && !ranked.ambiguous && credible)
        || !!decisiveMatch;
      const methodSources = [...new Set(ranked.best.sources || [])];
      const resolveMethod = methodSources.length ? methodSources.join('+') : 'multi-source';
      const soleFinanceMatch = !!ranked.soleFinanceMatch;

      console.log(
        '[resolve] ranked', companyName, '->', ranked.best.domain,
        'score=', score,
        'threshold=', RESOLVE_CONFIDENCE_THRESHOLD,
        'confident=', clearsThreshold,
        'ambiguous=', !!ranked.ambiguous,
        'soleFinance=', soleFinanceMatch,
        'financePts=', ranked.best.signals?.finance,
        'signals=', ranked.best.signals
      );

      // Only treat as a strong recommendation when confidence clears the threshold.
      // Weak / tied scores still return the best candidate + full pool for the picker.
      return store({
        domain: ranked.best.domain,
        isUnsure: !clearsThreshold,
        confidenceScore: score,
        confidenceSignals: ranked.best.signals || {},
        exactName: !!ranked.best.exactName,
        matchedName: ranked.best.name || companyName,
        industrySnippet: ranked.best.snippet
          || (clearsThreshold ? `${ranked.best.name || ranked.best.domain} · score ${score}` : `Possible match · score ${score}`),
        alternatives: gatheredCandidates.map(c => c.snippet || c.name || c.domain),
        alternativeDomains: gatheredCandidates.map(c => c.domain),
        candidates: gatheredCandidates,
        resolveMethod,
        financeFilterActive,
        soleFinanceMatch,
        decisiveMatch,
        ambiguous: !!ranked.ambiguous,
        fastPath: clearsThreshold && (ranked.best.exactName || methodSources.includes('wikidata') || soleFinanceMatch)
      });
    }

    // Permanent constraint: Industry / Headcount / Founders / Location must never be templated.
    const UNKNOWN = 'Unknown';
    const enrichmentValueRegistry = {
      industry: new Map(),
      contacts: new Map(),
      notes: new Map(),
      reset() {
        this.industry.clear();
        this.contacts.clear();
        this.notes.clear();
      }
    };

    function isBlankOrUnknown(v) {
      if (v == null) return true;
      const s = String(v).trim();
      return !s || s === '-' || /^unknown$/i.test(s) || /^needs manual/i.test(s) || /^needs verification/i.test(s);
    }

    function normalizeEnrichValue(v) {
      return String(v || '').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    const US_STATE_OR_PROVINCE = new Set([
      'AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD',
      'MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC',
      'SD','TN','TX','UT','VT','VA','WA','WV','WI','WY','DC',
      'AB','BC','MB','NB','NL','NS','NT','NU','ON','PE','QC','SK','YT'
    ]);

    const KNOWN_COUNTRIES = new Set([
      'usa', 'us', 'u.s.', 'u.s.a.', 'united states', 'united states of america',
      'uk', 'u.k.', 'united kingdom', 'england', 'scotland', 'wales', 'ireland', 'northern ireland',
      'canada', 'mexico', 'france', 'germany', 'spain', 'italy', 'portugal', 'netherlands', 'belgium',
      'switzerland', 'austria', 'sweden', 'norway', 'denmark', 'finland', 'poland', 'australia',
      'new zealand', 'japan', 'china', 'hong kong', 'singapore', 'india', 'israel', 'uae',
      'united arab emirates', 'south korea', 'korea', 'brazil', 'argentina', 'chile', 'colombia',
      'south africa', 'nigeria', 'kenya', 'egypt', 'turkey', 'greece', 'czech republic', 'luxembourg'
    ]);

    const KNOWN_SOLO_PLACES = new Set([
      'new york', 'new york city', 'san francisco', 'los angeles', 'chicago', 'boston', 'seattle',
      'austin', 'denver', 'miami', 'atlanta', 'dallas', 'houston', 'philadelphia', 'washington',
      'washington dc', 'london', 'paris', 'berlin', 'toronto', 'vancouver', 'montreal', 'tokyo',
      'singapore', 'hong kong', 'sydney', 'melbourne', 'dublin', 'amsterdam', 'zurich', 'geneva',
      'mountain view', 'cupertino', 'redmond', 'menlo park', 'palo alto', 'sunnyvale', 'ithaca',
      'united states', 'united kingdom', 'canada', 'germany', 'france'
    ]);

    const LOCATION_STREET_NOISE = /\b(avenue|ave\.?|suite|ste\.?|street|str\.?|road|rd\.?|boulevard|blvd\.?|floor|fl\.?|apartment|apt\.?|drive|dr\.?|lane|ln\.?|way|court|ct\.?|plaza|tower|room|unit|building|bldg\.?|pobox|po box|zip|postal)\b/i;

    const LOCATION_NON_PLACE = /\b(jesuit|catholic|protestant|baptist|methodist|evangelical|orthodox|jewish|muslim|hindu|buddhist|fixed income|private equity|venture capital|asset management|sales|marketing|engineering|operations|diversity|inclusion|product|research|innovation|proprietary|allogeneic|placeholder|founder|co-founder|ceo|cto|cfo|inc|llc|ltd|corp|gmbh|inter)\b/i;

    /**
     * Accept only real place-like Location values (City, ST / City, Country / known solo place).
     * Reject person names, adjectives, and address fragments.
     */
    function isValidLocationPlace(value) {
      if (isBlankOrUnknown(value)) return false;
      const raw = String(value).trim().replace(/\s+/g, ' ');
      if (raw.length < 3 || raw.length > 55) return false;
      if (LOCATION_STREET_NOISE.test(raw) || LOCATION_NON_PLACE.test(raw)) return false;
      if (/^\d/.test(raw)) return false;
      if (/[@#_/\\|]/.test(raw)) return false;

      const solo = raw.toLowerCase().replace(/\.$/, '');
      if (KNOWN_SOLO_PLACES.has(solo) || KNOWN_COUNTRIES.has(solo)) return true;

      // City, ST  (or City, Province) — 2-letter codes that are NOT states fall through to country check
      const cityState = raw.match(/^([A-Za-z][A-Za-z .'-]+),\s*([A-Za-z]{2})$/);
      if (cityState) {
        const city = cityState[1].trim();
        const st = cityState[2].toUpperCase();
        if (US_STATE_OR_PROVINCE.has(st)) {
          if (city.split(/\s+/).length > 4) return false;
          if (LOCATION_STREET_NOISE.test(city) || LOCATION_NON_PLACE.test(city)) return false;
          const tokens = city.split(/\s+/);
          if (tokens.length === 2) {
            const looksLikePerson =
              /^[A-Z][a-z'+.-]+$/.test(tokens[0]) &&
              /^[A-Z][a-z'+.-]+$/.test(tokens[1]) &&
              !/^(San|Los|Las|Fort|Port|Lake|Mount|New|North|South|East|West|Santa|Saint|St)$/i.test(tokens[0]) &&
              !/^(Beach|City|Hill|Hills|Park|Parks|Springs|Valley|Heights|Grove|Woods|Falls|Creek|Ridge|Bay|Harbor|Harbour|Vista|Junction|Center|Centre)$/i.test(tokens[1]);
            if (looksLikePerson && !KNOWN_SOLO_PLACES.has(city.toLowerCase())) {
              const TWO_WORD_CITIES = /^(New York|Los Angeles|San Francisco|San Diego|San Jose|Las Vegas|Fort Worth|Salt Lake|Des Moines|Baton Rouge|Ann Arbor|Palo Alto|Menlo Park|Mountain View|Santa Clara|Santa Monica|El Paso|St Louis|Saint Louis|Newport Beach|Long Beach|Palm Beach|Green Bay|Cedar Rapids)$/i;
              if (!TWO_WORD_CITIES.test(city)) return false;
            }
          }
          return true;
        }
        // e.g. "London, UK" — treat as City, Country below
      }

      // City, Country (including 2-letter country codes like UK, US)
      const cityCountry = raw.match(/^([A-Za-z][A-Za-z .'-]+),\s*([A-Za-z][A-Za-z .'-]+)$/);
      if (cityCountry) {
        const city = cityCountry[1].trim();
        const country = cityCountry[2].trim().toLowerCase().replace(/\.$/, '');
        if (!KNOWN_COUNTRIES.has(country)) return false;
        if (city.split(/\s+/).length > 4) return false;
        if (LOCATION_STREET_NOISE.test(city) || LOCATION_NON_PLACE.test(city)) return false;
        return true;
      }

      return false;
    }

    function sanitizeLocationValue(value) {
      return isValidLocationPlace(value) ? String(value).trim().replace(/\s+/g, ' ') : UNKNOWN;
    }

    /** Prefer a specific City, Region over a bare city name when both are valid. */
    function preferLocation(scrapedVal, dictVal) {
      const s = sanitizeLocationValue(scrapedVal);
      const d = sanitizeLocationValue(dictVal);
      if (isBlankOrUnknown(s) && isBlankOrUnknown(d)) return UNKNOWN;
      if (isBlankOrUnknown(s)) return d;
      if (isBlankOrUnknown(d)) return s;
      const sSpecific = String(s).includes(',');
      const dSpecific = String(d).includes(',');
      if (dSpecific && !sSpecific) return d;
      if (sSpecific && !dSpecific) return s;
      return s;
    }

    /**
     * Hard rule: if the same founder/industry/notes text is about to be written for two
     * different domains in this batch, blank it to Unknown (shared boilerplate = bug signal).
     */
    function applyBatchUniquenessGuard(domain, fields) {
      const host = String(domain || '').toLowerCase().replace(/^(https?:\/\/)?(www\.)?/, '').split('/')[0];
      const out = { ...fields };
      const guardedKeys = ['industry', 'contacts', 'notes'];
      for (const key of guardedKeys) {
        const raw = out[key];
        if (isBlankOrUnknown(raw)) {
          out[key] = UNKNOWN;
          continue;
        }
        const norm = normalizeEnrichValue(raw);
        // Ignore ultra-generic short tokens
        if (norm.length < 4) {
          out[key] = UNKNOWN;
          continue;
        }
        const owner = enrichmentValueRegistry[key].get(norm);
        if (owner && owner !== host) {
          console.warn(`[enrich] BLOCK duplicate ${key} "${raw}" already used by ${owner}; forcing Unknown for ${host}`);
          out[key] = UNKNOWN;
        } else {
          enrichmentValueRegistry[key].set(norm, host);
        }
      }
      // Headcount / location: never invent; blank or invalid place → Unknown
      if (isBlankOrUnknown(out.headcount)) out.headcount = UNKNOWN;
      out.location = sanitizeLocationValue(out.location);
      if (isBlankOrUnknown(out.gender)) out.gender = UNKNOWN;
      return out;
    }

    async function fetchPageHtml(absoluteUrl, timeoutMs = 2800) {
      const proxyBuilders = [
        (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
        (u) => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
        (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`,
        (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
      ];
      for (let i = 0; i < proxyBuilders.length; i++) {
        try {
          const controller = new AbortController();
          const t = setTimeout(() => controller.abort(), timeoutMs);
          const res = await fetch(proxyBuilders[i](absoluteUrl), { signal: controller.signal });
          clearTimeout(t);
          if (!res.ok) continue;
          let html = await res.text();
          if (html.trim().startsWith('{') && html.includes('"contents"')) {
            try { html = JSON.parse(html).contents || ''; } catch (_) {}
          }
          if (html && html.length >= 40) return html;
        } catch (_) { /* try next proxy */ }
      }
      return null;
    }

    function extractMeta(html, prop) {
      const patterns = [
        new RegExp(`<meta[^>]+(?:property|name)=["']${prop}["'][^>]+content=["']([^"']+)["']`, 'i'),
        new RegExp(`<meta[^>]+content=["']([^"']+)["'][^>]+(?:property|name)=["']${prop}["']`, 'i')
      ];
      for (const p of patterns) {
        const m = html.match(p);
        if (m?.[1]) return m[1].trim();
      }
      return '';
    }

    function stripHtmlToText(html) {
      return String(html || '')
        .replace(/<script[\s\S]*?<\/script>/gi, ' ')
        .replace(/<style[\s\S]*?<\/style>/gi, ' ')
        .replace(/<[^>]+>/g, ' ')
        .replace(/&nbsp;/gi, ' ')
        .replace(/&amp;/gi, '&')
        .replace(/&quot;/gi, '"')
        .replace(/&#39;/gi, "'")
        .replace(/\s+/g, ' ')
        .trim();
    }

    /**
     * Extract enrichment fields ONLY from scraped page HTML. No templates.
     */
    function extractEnrichmentFromHtml(html, companyName) {
      if (!html) {
        return { industry: UNKNOWN, headcount: UNKNOWN, location: UNKNOWN, contacts: UNKNOWN, gender: UNKNOWN, notes: UNKNOWN, source: 'none' };
      }

      const title = (html.match(/<title[^>]*>([^<]*)<\/title>/i)?.[1] || '').trim();
      const description = extractMeta(html, 'description') || extractMeta(html, 'og:description') || '';
      const siteName = extractMeta(html, 'og:site_name') || '';
      const footerMatch = html.match(/<footer[\s\S]{0,8000}<\/footer>/i);
      const footerText = footerMatch ? stripHtmlToText(footerMatch[0]).slice(0, 1500) : '';
      const aboutChunk = (() => {
        const m = html.match(/id=["']about["'][\s\S]{0,6000}|class=["'][^"']*about[^"']*["'][\s\S]{0,6000}/i);
        return m ? stripHtmlToText(m[0]).slice(0, 2000) : '';
      })();
      const bodyText = stripHtmlToText(html).slice(0, 8000);
      const corpus = `${title}. ${description}. ${siteName}. ${aboutChunk}. ${footerText}. ${bodyText}`;

      // Industry — entity type first (never let a program keyword override a university)
      let industry = UNKNOWN;
      const entityIndustry = inferEntityTypeIndustry(companyName, null);
      if (entityIndustry) {
        industry = entityIndustry;
      } else {
        const industryRules = [
          [/higher education|research university|ivy league|\buniversity\b|\bcollege\b/i, 'Education'],
          [/\bnonprofit\b|\bnon-profit\b|\bfoundation\b|\bcharity\b/i, 'Nonprofit / Foundation'],
          [/\bgovernment\b|\bmunicipal\b|\bfederal\b|\bpublic agency\b/i, 'Government'],
          [/venture capital|growth equity|private equity|seed (?:and|&) early-stage/i, 'Venture Capital'],
          [/fund administration|fund administrator/i, 'Fund Administration'],
          [/outsourced chief investment|OCIO/i, 'OCIO / Investment Management'],
          [/asset management|investment management|investment firm/i, 'Investment Management'],
          [/fintech|payments? infrastructure|financial technology/i, 'Financial Technology'],
          [/artificial intelligence|machine learning|language model/i, 'Artificial Intelligence'],
          [/software as a service|\bSaaS\b|productivity software/i, 'Software / SaaS'],
          [/e-?commerce|online retail/i, 'E-Commerce / Retail'],
          [/healthcare|biotech|therapeutics|clinical/i, 'Healthcare / Biotech'],
          [/legal services|law firm/i, 'Legal Services']
        ];
        for (const [re, label] of industryRules) {
          if (re.test(corpus)) { industry = label; break; }
        }
      }

      // Location — only accept real place patterns (City, ST / City, Country / known place)
      let location = UNKNOWN;
      const locPatterns = [
        // "headquartered in New York, NY" / "based in London, UK"
        /\b(?:based in|headquartered in|headquarters(?:\s+in)?|located in|hq in)\s+([A-Z][a-zA-Z .'-]{1,40}?),\s*([A-Z]{2}|[A-Z][a-zA-Z][a-zA-Z .'-]{1,30})\b/,
        // City, ST
        /\b([A-Z][a-zA-Z]+(?:\s[A-Z][a-zA-Z]+){0,3}),\s*([A-Z]{2})\b(?:\s+\d{5}(?:-\d{4})?)?/,
        // Well-known City, ST|Country
        /\b(New York|San Francisco|Los Angeles|London|Paris|Berlin|Toronto|Austin|Seattle|Boston|Chicago|Nashville|Mountain View|Cupertino|Redmond|Menlo Park|Palo Alto|Ithaca),\s*([A-Z]{2}|UK|USA|United States|France|Germany|Canada|England)?\b/i
      ];
      for (const re of locPatterns) {
        const m = corpus.match(re);
        if (!m) continue;
        let candidate = '';
        if (m[2] && String(m[2]).trim()) {
          candidate = `${m[1].trim()}, ${m[2].trim()}`.replace(/,\s*,/g, ',').trim();
        } else {
          candidate = m[1].replace(/^(?:based in|headquartered in|headquarters(?:\s+in)?|located in|hq in)\s+/i, '').trim();
        }
        candidate = sanitizeLocationValue(candidate);
        if (!isBlankOrUnknown(candidate)) {
          location = candidate;
          break;
        }
      }

      // Headcount — only explicit employee counts on page
      let headcount = UNKNOWN;
      const hc = corpus.match(/\b(\d{1,3}(?:,\d{3})*\+?\s*[-–to]+\s*\d{1,3}(?:,\d{3})*\+?|\d{1,3}(?:,\d{3})*\+)\s*(?:employees|people|team members|professionals)\b/i);
      if (hc) headcount = hc[1].replace(/\s+/g, ' ').trim();

      // Founders / leadership — only explicit attributions on page
      // Note: name captures are intentionally case-sensitive so /i does not turn
      // "Founder and CEO" into a fake name like "and CEO".
      let contacts = UNKNOWN;
      const founderPatterns = [
        /(?:[Ff]ounded by|[Cc]o-founded by|[Ff]ounder[:\s]+|[Cc]o-[Ff]ounder[:\s]+)([A-Z][a-z]+(?:\s+[A-Z][a-z.'-]+){1,3})/,
        /([A-Z][a-z]+(?:\s+[A-Z][a-z.'-]+){1,3})\s*,?\s*(?:Founder|Co-Founder|CEO|Chief Executive Officer|Managing Partner|Managing Director)\b/
      ];
      const badName = /^(The|Our|This|With|And|Or|For|From|About|Meet|Team|Company|Board)\b|^(and|or)\b/i;
      for (const re of founderPatterns) {
        const m = corpus.match(re);
        if (m?.[1]) {
          const name = m[1].trim();
          if (
            name.split(/\s+/).length >= 2 &&
            name.length < 60 &&
            !badName.test(name) &&
            !/\b(?:CEO|CTO|CFO|Founder)\b/i.test(name)
          ) {
            contacts = name;
            break;
          }
        }
      }

      // Notes — prefer meta description if present and non-generic
      let notes = UNKNOWN;
      if (description && description.length > 20 && description.length < 280) {
        notes = description;
      } else if (aboutChunk && aboutChunk.length > 40) {
        notes = aboutChunk.slice(0, 180).trim();
      }

      // Page must at least mention the company (weak confirmation) for any non-unknown field
      const nameTokens = String(companyName || '').toLowerCase().split(/\s+/).filter(t => t.length > 2);
      const pageLower = corpus.toLowerCase();
      const mentionsCompany = nameTokens.length === 0 || nameTokens.some(t => pageLower.includes(t.replace(/[^a-z0-9]/g, '')));
      if (!mentionsCompany) {
        return { industry: UNKNOWN, headcount: UNKNOWN, location: UNKNOWN, contacts: UNKNOWN, gender: UNKNOWN, notes: UNKNOWN, source: 'scrape-unconfirmed' };
      }

      return { industry, headcount, location, contacts, gender: UNKNOWN, notes, source: 'scrape' };
    }

    function lookupDictionaryByDomain(domain) {
      const host = String(domain || '').toLowerCase().replace(/^(https?:\/\/)?(www\.)?/, '').split('/')[0];
      if (!host) return null;
      for (const entry of Object.values(companyDictionary)) {
        if (String(entry.domain || '').toLowerCase() === host) return entry;
      }
      return null;
    }

    /** Curated lookup by confirmed domain first, then company name keys. */
    function lookupDictionaryEntry(domain, companyName) {
      const byDomain = lookupDictionaryByDomain(domain);
      if (byDomain) return byDomain;

      const raw = String(companyName || '').trim().toLowerCase();
      if (!raw) return null;
      if (companyDictionary[raw]) return companyDictionary[raw];
      const cleaned = cleanName(companyName);
      if (cleaned && companyDictionary[cleaned]) return companyDictionary[cleaned];

      const norm = companyKeyNorm(companyName);
      if (!norm) return null;
      let best = null;
      for (const [key, entry] of Object.entries(companyDictionary)) {
        const kn = companyKeyNorm(key);
        if (kn === norm) return entry;
        // Prefer longer key matches (e.g. "disciplina capital management" over "disciplina")
        if (kn && (norm.includes(kn) || kn.includes(norm)) && Math.min(kn.length, norm.length) >= 4) {
          if (!best || key.length > best.key.length) best = { key, entry };
        }
      }
      return best ? best.entry : null;
    }

    function dictFieldOrUnknown(val) {
      if (isBlankOrUnknown(val) || /^needs manual/i.test(String(val)) || /^needs verification/i.test(String(val))) {
        return UNKNOWN;
      }
      return String(val).trim();
    }

    /**
     * Dictionary wins when it has a real value; otherwise use scrape/api.
     */
    function preferDictThenScrape(dictVal, scrapedVal, { isLocation = false } = {}) {
      const d = isLocation ? sanitizeLocationValue(dictFieldOrUnknown(dictVal)) : dictFieldOrUnknown(dictVal);
      const s = isLocation ? sanitizeLocationValue(scrapedVal) : (isBlankOrUnknown(scrapedVal) ? UNKNOWN : scrapedVal);
      if (!isBlankOrUnknown(d)) return d;
      if (!isBlankOrUnknown(s)) return s;
      return UNKNOWN;
    }

    async function enrichCompanyDetails(domain, originalName, apiData = null) {
      const enrichKey = `v3|dict-first|${String(domain || '').toLowerCase()}|${String(originalName || '').trim().toLowerCase()}`;
      if (enrichCache.has(enrichKey)) {
        console.log('[enrich] CACHE HIT', domain);
        return applyBatchUniquenessGuard(domain, { ...enrichCache.get(enrichKey), fromCache: true });
      }

      const blank = {
        industry: UNKNOWN,
        headcount: UNKNOWN,
        location: UNKNOWN,
        contacts: UNKNOWN,
        gender: UNKNOWN,
        notes: UNKNOWN,
        enrichSource: 'none'
      };

      const host = String(domain || '').toLowerCase().replace(/^(https?:\/\/)?(www\.)?/, '').split('/')[0];

      // 1) Curated dictionary FIRST (domain or company name) — before scrape.
      const dictEntry = lookupDictionaryEntry(host, originalName);
      const fromDict = dictEntry
        ? {
            industry: dictFieldOrUnknown(dictEntry.industry),
            headcount: dictFieldOrUnknown(dictEntry.headcount),
            location: sanitizeLocationValue(dictFieldOrUnknown(dictEntry.location)),
            contacts: dictFieldOrUnknown(dictEntry.founder),
            gender: dictFieldOrUnknown(dictEntry.gender),
            notes: dictFieldOrUnknown(dictEntry.notes),
            enrichSource: 'dictionary'
          }
        : { ...blank };

      // Fast path: dictionary already has enough real fields — skip scrape + Wikidata (was blocking Enriched for ~30–60s/row)
      const dictFilled = [fromDict.industry, fromDict.headcount, fromDict.location, fromDict.contacts]
        .filter(v => !isBlankOrUnknown(v)).length;
      if (dictEntry && dictFilled >= 2) {
        const quick = {
          industry: isBlankOrUnknown(fromDict.industry) ? UNKNOWN : fromDict.industry,
          headcount: isBlankOrUnknown(fromDict.headcount) ? UNKNOWN : fromDict.headcount,
          location: sanitizeLocationValue(fromDict.location),
          contacts: isBlankOrUnknown(fromDict.contacts) ? UNKNOWN : fromDict.contacts,
          gender: isBlankOrUnknown(fromDict.gender) ? UNKNOWN : fromDict.gender,
          notes: isBlankOrUnknown(fromDict.notes) ? UNKNOWN : fromDict.notes,
          enrichSource: 'dictionary'
        };
        const guardedQuick = applyBatchUniquenessGuard(host, quick);
        enrichCache.set(enrichKey, guardedQuick);
        console.log('[enrich] FAST dictionary', originalName, '->', guardedQuick.enrichSource);
        return guardedQuick;
      }

      // Fast path: major-firm catalogue — industry known, skip scrape/wiki so Enriched ticks up immediately
      const majorHit = lookupMajorKnownFirm(originalName);
      if (majorHit && String(majorHit.domain || '').toLowerCase() === host) {
        const quickMaj = {
          industry: majorHit.industry || UNKNOWN,
          headcount: UNKNOWN,
          location: UNKNOWN,
          contacts: UNKNOWN,
          gender: UNKNOWN,
          notes: `${majorHit.label || originalName} · major firm`,
          enrichSource: 'major-firm'
        };
        const guardedMaj = applyBatchUniquenessGuard(host, quickMaj);
        enrichCache.set(enrichKey, guardedMaj);
        console.log('[enrich] FAST major-firm', originalName, '->', guardedMaj.industry);
        return guardedMaj;
      }

      // 2) Live scrape only to fill gaps the dictionary doesn't cover
      let scraped = { ...blank };
      try {
        const homeHtml = await fetchPageHtml(`https://${host}/`, 3000);
        scraped = extractEnrichmentFromHtml(homeHtml, originalName);
        const needsMore = [scraped.industry, scraped.headcount, scraped.location, scraped.contacts]
          .filter(v => isBlankOrUnknown(v)).length >= 3;
        if (needsMore) {
          const aboutHtml = await fetchPageHtml(`https://${host}/about`, 2800)
            || await fetchPageHtml(`https://${host}/about-us`, 2800)
            || await fetchPageHtml(`https://${host}/company`, 2800);
          if (aboutHtml) {
            const aboutFields = extractEnrichmentFromHtml(aboutHtml, originalName);
            scraped = {
              industry: !isBlankOrUnknown(scraped.industry) ? scraped.industry : aboutFields.industry,
              headcount: !isBlankOrUnknown(scraped.headcount) ? scraped.headcount : aboutFields.headcount,
              location: !isBlankOrUnknown(sanitizeLocationValue(scraped.location))
                ? sanitizeLocationValue(scraped.location)
                : sanitizeLocationValue(aboutFields.location),
              contacts: !isBlankOrUnknown(scraped.contacts) ? scraped.contacts : aboutFields.contacts,
              gender: UNKNOWN,
              notes: !isBlankOrUnknown(scraped.notes) ? scraped.notes : aboutFields.notes,
              enrichSource: 'scrape'
            };
          }
        } else if (!isBlankOrUnknown(scraped.industry) || !isBlankOrUnknown(scraped.contacts) || !isBlankOrUnknown(scraped.location)) {
          scraped = { ...scraped, enrichSource: 'scrape' };
        }
      } catch (e) {
        console.warn('[enrich] scrape failed', domain, e);
      }

      // Reject scrape contacts that are just the company name
      if (!isBlankOrUnknown(scraped.contacts)) {
        const c = String(scraped.contacts).trim().toLowerCase();
        const n = String(originalName || '').trim().toLowerCase();
        if (c === n || n.includes(c) || c.includes(n)) scraped.contacts = UNKNOWN;
      }

      // 3) Merge: dictionary wins for Industry / Location / Founders / Headcount / Notes
      let merged = {
        industry: preferDictThenScrape(fromDict.industry, scraped.industry),
        headcount: preferDictThenScrape(fromDict.headcount, scraped.headcount),
        location: preferDictThenScrape(fromDict.location, scraped.location, { isLocation: true }),
        contacts: preferDictThenScrape(fromDict.contacts, scraped.contacts),
        gender: preferDictThenScrape(fromDict.gender, scraped.gender),
        notes: preferDictThenScrape(fromDict.notes, scraped.notes),
        enrichSource: dictEntry
          ? (scraped.enrichSource === 'scrape' ? 'dictionary+scrape' : 'dictionary')
          : (scraped.enrichSource || 'none')
      };

      // Entity-type industry ALWAYS wins over keyword/dict noise for edu/gov/nonprofit
      const entityType = await lookupWikidataEntityType(originalName, host);
      if (entityType?.industry) {
        merged = {
          ...merged,
          industry: entityType.industry,
          enrichSource: `${merged.enrichSource}+entity-type:${entityType.source}`
        };
      }

      // 4) Optional API payload — only fill remaining Unknowns
      if (apiData) {
        merged = {
          industry: preferDictThenScrape(merged.industry, apiData.industry),
          headcount: preferDictThenScrape(merged.headcount, apiData.headcount),
          location: preferDictThenScrape(merged.location, apiData.location, { isLocation: true }),
          contacts: preferDictThenScrape(merged.contacts, apiData.founder),
          gender: preferDictThenScrape(merged.gender, apiData.gender),
          notes: preferDictThenScrape(merged.notes, apiData.notes),
          enrichSource: merged.enrichSource === 'none' ? 'api' : merged.enrichSource
        };
      }

      const result = {
        industry: isBlankOrUnknown(merged.industry) ? UNKNOWN : merged.industry,
        headcount: isBlankOrUnknown(merged.headcount) ? UNKNOWN : merged.headcount,
        location: sanitizeLocationValue(merged.location),
        contacts: isBlankOrUnknown(merged.contacts) ? UNKNOWN : merged.contacts,
        gender: isBlankOrUnknown(merged.gender) ? UNKNOWN : merged.gender,
        notes: isBlankOrUnknown(merged.notes) ? UNKNOWN : merged.notes,
        enrichSource: merged.enrichSource || 'none'
      };

      const guarded = applyBatchUniquenessGuard(host, result);
      enrichCache.set(enrichKey, guarded);
      console.log('[enrich]', originalName, '->', guarded.enrichSource, {
        industry: guarded.industry,
        headcount: guarded.headcount,
        location: guarded.location,
        contacts: guarded.contacts,
        dictHit: !!dictEntry
      });
      return guarded;
    }

    // --- SITE ACCESS CODE + LOCAL PROJECTS ---
    const ACCESS_SESSION_KEY = 'plum_site_unlocked';
    const PROJECTS_STORAGE_KEY = 'plum_local_projects_v1';
    const ACCURACY_STORAGE_KEY = 'plum_accuracy_feedback_v1';
    const LEARNED_STORAGE_KEY = 'plum_learned_corrections_v1';

    function emptyLearnedStore() {
      return { version: 1, updatedAt: null, corrections: [] };
    }

    function normalizeLearnedDomain(domain) {
      return String(domain || '')
        .trim()
        .toLowerCase()
        .replace(/^(https?:\/\/)?(www\.)?/, '')
        .split('/')[0]
        .replace(/[^a-z0-9.-]/g, '');
    }

    function readShippedLearnedCorrections() {
      const shipped = window.PLUM_LEARNED_CORRECTIONS;
      if (shipped && Array.isArray(shipped.corrections)) {
        return {
          version: 1,
          updatedAt: shipped.updatedAt || null,
          corrections: shipped.corrections.slice()
        };
      }
      return emptyLearnedStore();
    }

    function readLocalLearnedCorrections() {
      try {
        const raw = localStorage.getItem(LEARNED_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : null;
        if (parsed && Array.isArray(parsed.corrections)) {
          return {
            version: 1,
            updatedAt: parsed.updatedAt || null,
            corrections: parsed.corrections.slice()
          };
        }
      } catch (_) {}
      return emptyLearnedStore();
    }

    function mergeLearnedStores(base, overlay) {
      const byKey = new Map();
      for (const c of (base.corrections || [])) {
        if (!c?.companyKey || !c?.domain) continue;
        byKey.set(c.companyKey, { ...c });
      }
      for (const c of (overlay.corrections || [])) {
        if (!c?.companyKey || !c?.domain) continue;
        const prev = byKey.get(c.companyKey);
        if (!prev) {
          byKey.set(c.companyKey, { ...c });
          continue;
        }
        const prevTs = Date.parse(prev.updatedAt || prev.createdAt || 0) || 0;
        const nextTs = Date.parse(c.updatedAt || c.createdAt || 0) || 0;
        if (nextTs >= prevTs) byKey.set(c.companyKey, { ...c });
      }
      const corrections = [...byKey.values()].sort((a, b) =>
        String(a.companyName || '').localeCompare(String(b.companyName || ''))
      );
      const updatedAt = [base.updatedAt, overlay.updatedAt].filter(Boolean).sort().slice(-1)[0] || null;
      return { version: 1, updatedAt, corrections };
    }

    let learnedCorrectionsStore = mergeLearnedStores(
      readShippedLearnedCorrections(),
      readLocalLearnedCorrections()
    );

    function getLearnedCorrectionsSnapshot() {
      return {
        version: 1,
        updatedAt: learnedCorrectionsStore.updatedAt,
        corrections: (learnedCorrectionsStore.corrections || []).map(c => ({ ...c }))
      };
    }

    function lookupLearnedCorrection(companyName) {
      const key = companyKeyNorm(companyName);
      if (!key) return null;
      const hit = (learnedCorrectionsStore.corrections || []).find(c => c.companyKey === key);
      if (!hit?.domain) return null;
      return { ...hit };
    }

    async function persistLearnedCorrectionsToServer(store) {
      try {
        const res = await fetch('/api/learned-corrections', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(store)
        });
        if (!res.ok) return { ok: false, reason: `HTTP ${res.status}` };
        const json = await res.json().catch(() => ({}));
        return { ok: true, ...json };
      } catch (e) {
        return { ok: false, reason: e.message || 'offline' };
      }
    }

    async function commitLearnedCorrectionsStore(nextStore, { skipServer } = {}) {
      learnedCorrectionsStore = {
        version: 1,
        updatedAt: nextStore.updatedAt || new Date().toISOString(),
        corrections: (nextStore.corrections || []).slice()
      };
      try {
        localStorage.setItem(LEARNED_STORAGE_KEY, JSON.stringify(learnedCorrectionsStore));
      } catch (_) {}
      // Bust resolve cache so learned hits apply immediately
      try { resolveCache.clear(); } catch (_) {}
      if (!skipServer) {
        const remote = await persistLearnedCorrectionsToServer(learnedCorrectionsStore);
        return { store: getLearnedCorrectionsSnapshot(), remote };
      }
      return { store: getLearnedCorrectionsSnapshot(), remote: { ok: false, reason: 'skipped' } };
    }

    async function upsertLearnedCorrection({ companyName, domain, source }) {
      const name = String(companyName || '').trim();
      const cleanDomain = normalizeLearnedDomain(domain);
      const key = companyKeyNorm(name);
      if (!name || !key || !cleanDomain || !cleanDomain.includes('.')) {
        return { ok: false, reason: 'invalid' };
      }
      const now = new Date().toISOString();
      const list = (learnedCorrectionsStore.corrections || []).slice();
      const idx = list.findIndex(c => c.companyKey === key);
      const entry = {
        companyName: name,
        companyKey: key,
        domain: cleanDomain,
        source: source || 'manual',
        createdAt: idx >= 0 ? (list[idx].createdAt || now) : now,
        updatedAt: now
      };
      if (idx >= 0) list[idx] = entry;
      else list.push(entry);
      list.sort((a, b) => String(a.companyName || '').localeCompare(String(b.companyName || '')));
      const result = await commitLearnedCorrectionsStore({
        version: 1,
        updatedAt: now,
        corrections: list
      });
      console.log('[learned] upsert', name, '->', cleanDomain, 'source=', source, 'remote=', result.remote?.ok);
      return { ok: true, entry, ...result };
    }

    async function updateLearnedCorrection(companyKey, fields) {
      const key = companyKeyNorm(companyKey) || String(companyKey || '').trim();
      const list = (learnedCorrectionsStore.corrections || []).slice();
      const idx = list.findIndex(c => c.companyKey === key);
      if (idx < 0) return { ok: false, reason: 'missing' };
      const now = new Date().toISOString();
      const nextName = fields.companyName != null ? String(fields.companyName).trim() : list[idx].companyName;
      const nextDomain = fields.domain != null ? normalizeLearnedDomain(fields.domain) : list[idx].domain;
      if (!nextName || !nextDomain || !nextDomain.includes('.')) return { ok: false, reason: 'invalid' };
      const nextKey = companyKeyNorm(nextName);
      const deduped = list.filter((c, i) => i === idx || c.companyKey !== nextKey);
      const at = deduped.findIndex(c => c.companyKey === key || c.companyKey === list[idx].companyKey);
      const targetIdx = at >= 0 ? at : 0;
      deduped[targetIdx] = {
        ...list[idx],
        companyName: nextName,
        companyKey: nextKey,
        domain: nextDomain,
        source: fields.source || list[idx].source || 'edit',
        updatedAt: now
      };
      deduped.sort((a, b) => String(a.companyName || '').localeCompare(String(b.companyName || '')));
      const result = await commitLearnedCorrectionsStore({ version: 1, updatedAt: now, corrections: deduped });
      return { ok: true, ...result };
    }

    async function removeLearnedCorrection(companyKey) {
      const key = companyKeyNorm(companyKey) || String(companyKey || '').trim();
      const list = (learnedCorrectionsStore.corrections || []).filter(c => c.companyKey !== key);
      const result = await commitLearnedCorrectionsStore({
        version: 1,
        updatedAt: new Date().toISOString(),
        corrections: list
      });
      return { ok: true, ...result };
    }

    function downloadLearnedCorrectionsJson() {
      const blob = new Blob([JSON.stringify(getLearnedCorrectionsSnapshot(), null, 2) + '\n'], {
        type: 'application/json'
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'learned-corrections.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function readAccuracyLog() {
      try {
        const raw = localStorage.getItem(ACCURACY_STORAGE_KEY);
        const list = raw ? JSON.parse(raw) : [];
        return Array.isArray(list) ? list : [];
      } catch (_) {
        return [];
      }
    }

    function writeAccuracyLog(list) {
      localStorage.setItem(ACCURACY_STORAGE_KEY, JSON.stringify((list || []).slice(-500)));
    }

    function getAccuracyStats() {
      const log = readAccuracyLog();
      const correct = log.filter(e => e && e.correct === true).length;
      const incorrect = log.filter(e => e && e.correct === false).length;
      const total = correct + incorrect;
      return {
        correct,
        incorrect,
        total,
        rate: total ? Math.round((correct / total) * 1000) / 10 : null
      };
    }

    function appendAccuracyFeedback(entry) {
      const log = readAccuracyLog();
      log.push({
        ...entry,
        ts: entry.ts || new Date().toISOString()
      });
      writeAccuracyLog(log);
      return getAccuracyStats();
    }

    function getAccessCode() {
      return String((window.PLUM_ACCESS && window.PLUM_ACCESS.code) || '').trim();
    }

    function isSiteUnlocked() {
      return localStorage.getItem(ACCESS_SESSION_KEY) === '1';

    function unlockSite() {

    function formatSavedAt(iso) {
      if (!iso) return '';
      try {
        const d = new Date(iso);
        return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      } catch (_) {
        return String(iso);
      }
    }

    function AccessGate({ onUnlock }) {
      const [code, setCode] = useState('');
      const [msg, setMsg] = useState('');
      const expected = getAccessCode();

      const submit = (e) => {
        e.preventDefault();
        if (!expected) {
          setMsg('No access code configured. Set window.PLUM_ACCESS.code in site-config.js (or PLUM_ACCESS_CODE on Vercel).');
          return;
        }
        if (code.trim() !== expected) {
          setMsg('Incorrect code. Try again.');
          return;
        }
        unlockSite();
        setMsg('');
        onUnlock?.();
      };

      return (
        <div className="login-screen">
          <div className="login-card">
            <h1>Plum Alley Enrichment</h1>
            <p>Enter the team access code to continue. No account or email required.</p>
            <form onSubmit={submit}>
              <label>Access code</label>
              <input
                type="password"
                value={code}
                onChange={(e) => setCode(e.target.value)}
                placeholder="••••••••"
                autoFocus
                autoComplete="current-password"
                required
              />
              <button type="submit" className="btn btn-primary">
                Enter
              </button>
            </form>
            {msg ? <div className="login-msg err">{msg}</div> : null}
          </div>
        </div>
      );
    }

      };

      const getHeadcountColumnKey = () => {
        const h = headers.find(h => h.label.toLowerCase().includes('headcount') || h.label.toLowerCase().includes('size') || h.label.toLowerCase().includes('employee'));
        return h ? h.key : 'headcount';
      };

      const getLocationColumnKey = () => {
        const h = headers.find(h => h.label.toLowerCase().includes('location') || h.label.toLowerCase().includes('city') || h.label.toLowerCase().includes('address'));
        return h ? h.key : 'location';
      };

      const getContactsColumnKey = () => {
        const h = headers.find(h => h.label.toLowerCase().includes('founder') || (h.label.toLowerCase().includes('contact') && !h.label.toLowerCase().includes('source')) || h.label.toLowerCase().includes('people') || h.label.toLowerCase().includes('ceo'));
        return h ? h.key : 'contacts';
      };
      const getSourceContactColumnKey = () => {
        const h = headers.find(h => h.key === 'sourceContact' || h.label.toLowerCase().includes('source') || h.label.toLowerCase() === 'contact / source');
        return h ? h.key : 'sourceContact';
      };

      const getNotesColumnKey = () => {
        const h = headers.find(h => h.label.toLowerCase().includes('note') || h.label.toLowerCase().includes('description') || h.label.toLowerCase().includes('detail'));
        return h ? h.key : 'notes';
      };

      const getGenderColumnKey = () => {
        const h = headers.find(h => h.label.toLowerCase().includes('gender') || h.label.toLowerCase().includes('sex') || h.label.toLowerCase().includes('f/m'));
        return h ? h.key : 'gender';
      };

      const handleHeaderDoubleClick = (key, label) => {
        setEditingHeader(key);
        setEditingHeaderValue(label);
      };

      const handleHeaderSave = () => {
        if (!editingHeader) return;
        const newValue = editingHeaderValue.trim();
        if (newValue) {
          setHeaders(prev => prev.map(h => h.key === editingHeader ? { ...h, label: newValue } : h));
        }
        setEditingHeader(null);
      };

      const handleHeaderKeyDown = (e) => {
        if (e.key === 'Enter') {
          handleHeaderSave();
        } else if (e.key === 'Escape') {
          setEditingHeader(null);
        }
      };

      // Live link verification: DNS + optional content, with proxy fallbacks.
      // Strong domain↔name match + DNS success is enough — do not fail solely because proxies are down.
      const verifyDomainLive = async (domain, companyName, options = {}) => {
        const log = (...args) => console.log('[verify]', domain, ...args);
        const cleanDom = String(domain || '').toLowerCase().replace(/^(https?:\/\/)?(www\.)?/, '').split('/')[0].trim();
        const cleanComp = String(companyName || '').toLowerCase().trim();
        const cacheKey = makeVerifyCacheKey(cleanDom, cleanComp);

        if (verifyCache.has(cacheKey)) {
          const cached = verifyCache.get(cacheKey);
          log('CACHE HIT', cached.ok ? 'OK' : 'FAIL', cached.reason);
          return { ...cached, fromCache: true };
        }

        const storeVerify = (result) => {
          verifyCache.set(cacheKey, result);
          return result;
        };

        if (!cleanDom || !cleanDom.includes('.')) {
          log('FAIL invalid domain');
          return storeVerify({ ok: false, reason: 'Invalid domain' });
        }
        if (/\b(unknown|random|test|asdf)\b/.test(cleanComp)) {
          log('FAIL placeholder name');
          return storeVerify({ ok: false, reason: 'Placeholder company name' });
        }
        if (cleanDom.includes('invalid-link.fake') || cleanDom.includes('asdf')) {
          log('FAIL blocked domain');
          return storeVerify({ ok: false, reason: 'Blocked domain' });
        }

        const stripLegal = (s) => s
          .toLowerCase()
          .replace(/[,.]?\s*\b(inc|llc|l\.l\.c|co|corp|corporation|ltd|limited|gmbh|plc|llp|lp|sa|nv|bv|pvt|foundation|university|office|department|ministry)\b\.?/gi, ' ')
          .replace(/[^a-z0-9\s]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();

        const nameKey = stripLegal(cleanComp).replace(/\s+/g, '');
        const domParts = cleanDom.split('.');
        const domBase = (domParts.length > 2 && !['co', 'com', 'org', 'net', 'gov', 'edu'].includes(domParts[domParts.length - 2])
          ? domParts[domParts.length - 2]
          : domParts[0]).replace(/[^a-z0-9]/g, '');

        const domainStrongMatch = (() => {
          if (!nameKey || !domBase) return false;
          if (domBase === nameKey) return true;
          // Domain contains the brand (fordfoundation.org ↔ Ford Foundation → "ford")
          if (nameKey.length >= 3 && (domBase.includes(nameKey) || nameKey.includes(domBase))) {
            const ratio = Math.min(domBase.length, nameKey.length) / Math.max(domBase.length, nameKey.length);
            if (ratio >= 0.5 || domBase.startsWith(nameKey) || nameKey.startsWith(domBase)) return true;
          }
          // multi-word collapsed: "westvirginiauniversity" vs domain tokens
          const tokens = stripLegal(cleanComp).split(' ').filter(t => t.length > 2);
          if (tokens.length >= 2) {
            const joined = tokens.join('');
            if (domBase === joined || joined.includes(domBase) || domBase.includes(joined.slice(0, Math.min(12, joined.length)))) return true;
            if (tokens.filter(t => domBase.includes(t) || cleanDom.includes(t)).length >= Math.ceil(tokens.length * 0.6)) return true;
          }
          return false;
        })();

        log('domainStrongMatch=', domainStrongMatch, 'domBase=', domBase, 'nameKey=', nameKey, 'fastPath=', !!options.fastPath);

        // 1) DNS check — Google DoH, then Cloudflare DoH fallback (browser/network blips)
        const checkDns = async (endpoint, label, headers = {}) => {
          try {
            const dnsRes = await fetch(endpoint, { headers });
            if (!dnsRes.ok) {
              log('DNS', label, 'HTTP', dnsRes.status);
              return false;
            }
            const dnsJson = await dnsRes.json();
            const ok = dnsJson.Status === 0 && Array.isArray(dnsJson.Answer) && dnsJson.Answer.length > 0;
            log('DNS', label, ok ? 'OK' : 'FAIL', 'status=', dnsJson.Status, 'answers=', dnsJson.Answer?.length || 0);
            return ok;
          } catch (e) {
            log('DNS', label, 'error', e.message || e);
            return false;
          }
        };

        let dnsOk = await checkDns(
          `https://dns.google/resolve?name=${encodeURIComponent(cleanDom)}&type=A`,
          'google'
        );
        if (!dnsOk) {
          await new Promise(r => setTimeout(r, 150));
          dnsOk = await checkDns(
            `https://dns.google/resolve?name=${encodeURIComponent(cleanDom)}&type=A`,
            'google-retry'
          );
        }
        if (!dnsOk) {
          dnsOk = await checkDns(
            `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(cleanDom)}&type=A`,
            'cloudflare',
            { Accept: 'application/dns-json' }
          );
        }

        if (!dnsOk) {
          // Curated catalogue / explicit trust: do not block enrichment on DNS outages
          if (options.allowDnsFail || options.trustedCatalogue) {
            log('PASS trusted path without DNS');
            return storeVerify({ ok: true, reason: 'Trusted catalogue (DNS unavailable)' });
          }
          log('FAIL DNS does not resolve');
          return storeVerify({ ok: false, reason: 'Domain does not resolve (DNS)' });
        }

        // Strong signal / known fast path: domain closely matches name + DNS → verified (skip proxies)
        if (domainStrongMatch || options.fastPath || options.trustedCatalogue || isKnownUnambiguousCompany(companyName)) {
          log('PASS strong domain+DNS match (content fetch skipped)');
          return storeVerify({ ok: true, reason: 'Verified via DNS + domain/name match' });
        }

        // 2) Content fetch via proxy waterfall (best-effort when domain match is weak)
        // Fail fast: short per-proxy timeouts, then move on. One retry round only.
        const targetUrl = `https://${cleanDom}`;
        const proxyBuilders = [
          (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
          (u) => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
